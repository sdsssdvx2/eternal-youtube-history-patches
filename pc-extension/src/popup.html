<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eternal YouTube History</title><link rel="stylesheet" href="popup.css"></head><body>
<main>
  <h1>Eternal YouTube History</h1>
  <div class="stat"><b id="count">-</b><span id="countLabel">서버 원장 영상</span></div>
  <div id="eventStat" class="eventStat" hidden>정확 시각 시청 이벤트 <b id="eventCount">0</b>회</div>
  <div id="displayRule" class="eventStat"></div>
  <div id="watchLaterSafety" class="eventStat"></div>
  <button id="openHistory" class="historyButton">서버 영구 기록 검색</button>
  <button id="syncRecent">YouTube History 수동 누락 복구</button>
  <button id="syncFull" class="secondary">과거 기록 최대한 복구</button>
  <div class="hint">v0.10.3에서는 Watch Later 삭제 기능을 안전 잠금했습니다. 삭제 전 스냅샷·삭제 journal·정확한 항목 재검증·복구 기능이 갖춰질 때까지 자동/수동 정리는 실행되지 않습니다.</div>
  <div id="status"></div>
  <a id="options" href="#">설정</a>
</main><script src="popup.js"></script></body></html>
