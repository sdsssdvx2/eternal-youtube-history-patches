name: Sync Morphe compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: '12 */6 * * *'

concurrency:
  group: sync-morphe-compatibility
  cancel-in-progress: false

jobs:
  sync:
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Eternal patches
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve latest stable Morphe release
        id: stable
        shell: bash
        run: |
          tag="$(curl -fsSL https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest | jq -r '.tag_name')"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo 'Could not resolve latest stable Morphe release' >&2
            exit 1
          fi
          echo "ref=$tag" >> "$GITHUB_OUTPUT"
          echo "Using Morphe stable release: $tag"

      - name: Checkout official Morphe stable patches
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patches
          ref: ${{ steps.stable.outputs.ref }}
          path: .morphe-official
          fetch-depth: 1

      - name: Sync stable YouTube targets
        run: |
          python3 .github/scripts/sync_morphe_compat.py \
            .morphe-official/patches/src/main/kotlin/app/morphe/patches/youtube/shared/Constants.kt \
            patches/src/main/kotlin/app/eternal/patches/youtube/history/EternalHistoryPatch.kt

      - name: Commit if compatibility changed
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          echo 'changed=false' >> "$GITHUB_OUTPUT"
          if git diff --quiet -- patches/src/main/kotlin/app/eternal/patches/youtube/history/EternalHistoryPatch.kt; then
            echo "No compatibility change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches/src/main/kotlin/app/eternal/patches/youtube/history/EternalHistoryPatch.kt
          git commit -m "fix: sync YouTube compatibility with stable Morphe release"
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      # Pushes authenticated by GITHUB_TOKEN intentionally do not recursively start push-triggered
      # workflows. Explicit workflow_dispatch is the supported exception, so a compatibility commit
      # must hand off to Release itself or main can remain newer than the published Eternal MPP.
      - name: Dispatch Eternal release for the synced main commit
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'Dispatched release.yml for the newly synced compatibility commit.'
