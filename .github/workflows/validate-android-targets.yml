name: Validate deployed Android update targets

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-update-status.json'
      - '.github/workflows/validate-android-targets.yml'

permissions:
  contents: read

jobs:
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      YT_TRUSTED_SHA256: 4b3ca9de0eb6857d43fa8766a724a2eba6405dfdbcdfb20eef6cb8950e805e2c
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: krishhari2105/morphe-builds
          path: .validation/morphe-builds
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Acquire exact deployed YouTube base
        env:
          PYTHONPATH: ${{ github.workspace }}/.validation/morphe-builds
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests >/dev/null
          version="$(jq -r '.youtube.version' android-update-status.json)"
          mkdir -p .validation/input
          VERSION="$version" python - <<'PY'
          import os, zipfile
          from pathlib import Path
          from morphe_builder.apkmirror import ApkMirrorResolver
          from morphe_builder.models import AppConfig
          version=os.environ['VERSION']; trusted=os.environ['YT_TRUSTED_SHA256'].lower()
          app=AppConfig(key='youtube',name='YouTube',package='com.google.android.youtube',apkmirror_url='https://www.apkmirror.com/apk/google-inc/youtube/',formats=('apk',),prefer=('universal',),target_abi='arm64-v8a')
          r=ApkMirrorResolver(min_request_interval=1.2,max_release_attempts=4,max_variant_attempts=12)
          out=Path('.validation/input/youtube.apk'); errs=[]
          for url,ref in r.iter_candidates(app,version):
              try:
                  got=r.download_candidate(url,ref,out)
                  with zipfile.ZipFile(out) as z: names=set(z.namelist())
                  if 'AndroidManifest.xml' not in names or 'resources.arsc' not in names or not any(n == 'classes.dex' or (n.startswith('classes') and n.endswith('.dex')) for n in names):
                      raise RuntimeError('not standalone APK')
                  if got.sha256.lower() != trusted: raise RuntimeError('SHA-256 mismatch')
                  print('selected exact deployed YouTube base',got.size,got.sha256,ref); break
              except Exception as e:
                  errs.append(str(e)); out.unlink(missing_ok=True)
          else: raise RuntimeError('base acquisition failed: '+' | '.join(errs[-8:]))
          PY
      - name: Resolve recorded deployed patch bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .validation/tools .validation/out
          morphe_tag="$(jq -r '.morphe_patches' android-update-status.json)"
          eternal_tag="$(jq -r '.eternal_patches' android-update-status.json)"
          desktop="$(curl -fsSL https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest)"
          morphe="$(curl -fsSL "https://api.github.com/repos/MorpheApp/morphe-patches/releases/tags/${morphe_tag}")"
          eternal="$(curl -fsSL "https://api.github.com/repos/sdsssdvx2/eternal-youtube-history-patches/releases/tags/${eternal_tag}")"
          desktop_url="$(jq -r '.assets[] | select(.name | startswith("morphe-desktop-") and endswith("-all.jar")) | .browser_download_url' <<<"$desktop" | head -1)"
          morphe_url="$(jq -r '.assets[] | select((.name | startswith("patches-")) and (.name | endswith(".mpp")) and ((.name | contains("-javadoc")) | not) and ((.name | contains("-sources")) | not)) | .browser_download_url' <<<"$morphe" | head -1)"
          eternal_url="$(jq -r '.assets[] | select((.name | startswith("patches-")) and (.name | endswith(".mpp")) and ((.name | contains("-javadoc")) | not) and ((.name | contains("-sources")) | not)) | .browser_download_url' <<<"$eternal" | head -1)"
          curl -fL --retry 3 "$desktop_url" -o .validation/tools/morphe-desktop.jar
          curl -fL --retry 3 "$morphe_url" -o .validation/tools/morphe.mpp
          curl -fL --retry 3 "$eternal_url" -o .validation/tools/eternal.mpp
      - name: Reproduce deployed YouTube entirely on server
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.youtube.version' android-update-status.json)"
          java -Xmx5g -jar .validation/tools/morphe-desktop.jar patch \
            -p .validation/tools/morphe.mpp \
            -p .validation/tools/eternal.mpp -e 'Eternal YouTube History' \
            -o .validation/out/youtube.apk \
            -r .validation/out/result.json \
            .validation/input/youtube.apk
          test -s .validation/out/youtube.apk
          test -s .validation/out/result.json
          cat .validation/out/result.json
          jq -e --arg version "$version" '
            .success == true
            and .packageName == "com.google.android.youtube"
            and .packageVersion == $version
            and ((.appliedPatches // []) | index("Eternal YouTube History") != null)
            and ((.failedPatches // []) | length == 0)
          ' .validation/out/result.json >/dev/null
          echo "PASS deployed YouTube target reproduces with recorded Morphe/Eternal tags"
      - name: Remove proprietary files
        if: always()
        run: rm -rf .validation/input .validation/out .validation/tools

  youtube-music:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MUSIC_TRUSTED_SHA256: 5c4add71134d46818c855959e1c7029518c68be9e56ef172119626539d32c852
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: krishhari2105/morphe-builds
          path: .validation/morphe-builds
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Acquire exact deployed YouTube Music base
        env:
          PYTHONPATH: ${{ github.workspace }}/.validation/morphe-builds
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests >/dev/null
          version="$(jq -r '.youtube_music.version' android-update-status.json)"
          mkdir -p .validation/input
          VERSION="$version" python - <<'PY'
          import os, zipfile
          from pathlib import Path
          from morphe_builder.apkmirror import ApkMirrorResolver
          from morphe_builder.models import AppConfig
          version=os.environ['VERSION']; trusted=os.environ['MUSIC_TRUSTED_SHA256'].lower()
          app=AppConfig(key='music',name='YouTube Music',package='com.google.android.apps.youtube.music',apkmirror_url='https://www.apkmirror.com/apk/google-inc/youtube-music/',formats=('apk',),prefer=('universal','arm64-v8a'),target_abi='arm64-v8a')
          r=ApkMirrorResolver(min_request_interval=1.2,max_release_attempts=4,max_variant_attempts=12)
          out=Path('.validation/input/music.apk'); errs=[]
          for url,ref in r.iter_candidates(app,version):
              try:
                  got=r.download_candidate(url,ref,out)
                  with zipfile.ZipFile(out) as z: names=set(z.namelist())
                  if 'AndroidManifest.xml' not in names or 'resources.arsc' not in names or not any(n == 'classes.dex' or (n.startswith('classes') and n.endswith('.dex')) for n in names):
                      raise RuntimeError('not standalone APK')
                  if got.sha256.lower() != trusted: raise RuntimeError('SHA-256 mismatch')
                  print('selected exact deployed Music base',got.size,got.sha256,ref); break
              except Exception as e:
                  errs.append(str(e)); out.unlink(missing_ok=True)
          else: raise RuntimeError('base acquisition failed: '+' | '.join(errs[-8:]))
          PY
      - name: Resolve recorded deployed Morphe bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .validation/tools .validation/out
          morphe_tag="$(jq -r '.morphe_patches' android-update-status.json)"
          desktop="$(curl -fsSL https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest)"
          morphe="$(curl -fsSL "https://api.github.com/repos/MorpheApp/morphe-patches/releases/tags/${morphe_tag}")"
          desktop_url="$(jq -r '.assets[] | select(.name | startswith("morphe-desktop-") and endswith("-all.jar")) | .browser_download_url' <<<"$desktop" | head -1)"
          morphe_url="$(jq -r '.assets[] | select((.name | startswith("patches-")) and (.name | endswith(".mpp")) and ((.name | contains("-javadoc")) | not) and ((.name | contains("-sources")) | not)) | .browser_download_url' <<<"$morphe" | head -1)"
          curl -fL --retry 3 "$desktop_url" -o .validation/tools/morphe-desktop.jar
          curl -fL --retry 3 "$morphe_url" -o .validation/tools/morphe.mpp
      - name: Reproduce deployed YouTube Music entirely on server
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.youtube_music.version' android-update-status.json)"
          java -Xmx5g -jar .validation/tools/morphe-desktop.jar patch \
            -p .validation/tools/morphe.mpp \
            -o .validation/out/music.apk \
            -r .validation/out/result.json \
            .validation/input/music.apk
          test -s .validation/out/music.apk
          test -s .validation/out/result.json
          cat .validation/out/result.json
          jq -e --arg version "$version" '
            .success == true
            and .packageName == "com.google.android.apps.youtube.music"
            and .packageVersion == $version
            and ((.failedPatches // []) | length == 0)
          ' .validation/out/result.json >/dev/null
          echo "PASS deployed Music target reproduces with recorded Morphe tag"
      - name: Remove proprietary files
        if: always()
        run: rm -rf .validation/input .validation/out .validation/tools
