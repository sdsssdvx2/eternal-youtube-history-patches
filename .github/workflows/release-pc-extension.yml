name: Release PC extension

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'pc-extension/latest.json'
      - 'pc-extension/releases/**'
      - '.github/workflows/release-pc-extension.yml'

permissions:
  contents: write

concurrency:
  group: eternal-pc-extension-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate canonical ZIP
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' pc-extension/latest.json)"
          rel="$(jq -r '.file' pc-extension/latest.json)"
          expected="$(jq -r '.sha256' pc-extension/latest.json)"
          file="pc-extension/${rel}"
          test -f "$file"
          actual="$(sha256sum "$file" | awk '{print $1}')"
          test "$actual" = "$expected"
          rm -rf .pc-release && mkdir .pc-release
          unzip -q "$file" -d .pc-release
          manifest="$(find .pc-release -path '*/extension/manifest.json' -print -quit)"
          test -n "$manifest"
          manifest_version="$(jq -r '.version' "$manifest")"
          test "$manifest_version" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "sha256=$actual" >> "$GITHUB_OUTPUT"

      - name: Publish or refresh PC release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          FILE: ${{ steps.meta.outputs.file }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          tag="pc-v${VERSION}"
          notes="Eternal YouTube History PC extension v${VERSION}\n\nSHA-256: ${SHA256}\n\nFor an existing unpacked install, overwrite the current extension directory with the ZIP's extension directory and press Reload in chrome://extensions. Do not remove the extension."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$FILE" --clobber
          else
            gh release create "$tag" "$FILE" --title "Eternal YouTube History PC v${VERSION}" --notes "$notes"
          fi
