name: Analyze YouTube playlist components

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-playlist-components.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Checkout APK acquisition helper
        uses: actions/checkout@v7
        with:
          repository: krishhari2105/morphe-builds
          path: .analysis/morphe-builds
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Acquire validated YouTube 21.20.405 APK
        env:
          PYTHONPATH: ${{ github.workspace }}/.analysis/morphe-builds
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests >/dev/null
          mkdir -p .analysis/input
          python - <<'PY'
          from pathlib import Path
          from morphe_builder.apkmirror import ApkMirrorResolver
          from morphe_builder.models import AppConfig

          expected='4b3ca9de0eb6857d43fa8766a724a2eba6405dfdbcdfb20eef6cb8950e805e2c'
          app=AppConfig(key='youtube',name='YouTube',package='com.google.android.youtube',
              apkmirror_url='https://www.apkmirror.com/apk/google-inc/youtube/',formats=('apk',),
              prefer=('universal',),target_abi='arm64-v8a')
          out=Path('.analysis/input/youtube.apk')
          resolver=ApkMirrorResolver(min_request_interval=1.2,max_release_attempts=4,max_variant_attempts=12)
          errors=[]
          for index,(url,referer) in enumerate(resolver.iter_candidates(app,'21.20.405'),start=1):
              try:
                  result=resolver.download_candidate(url,referer,out)
                  print('candidate',index,'bytes=',result.size,'sha256=',result.sha256)
                  if result.sha256 != expected:
                      raise RuntimeError('hash mismatch')
                  break
              except Exception as exc:
                  errors.append(str(exc)); out.unlink(missing_ok=True)
          else:
              raise RuntimeError('validated APK not found: '+' | '.join(errors[-6:]))
          PY

      - name: Inspect DEX component identifier strings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .analysis/dex
          unzip -q .analysis/input/youtube.apk 'classes*.dex' -d .analysis/dex
          find .analysis/dex -type f -name 'classes*.dex' -print0 \
            | xargs -0 strings -a \
            | sort -u > .analysis/dex-strings.txt

          echo '=== playlist/list component-like identifiers ==='
          grep -E '^[A-Za-z0-9_.-]*(playlist|watch_later|watchlater|list_video|video_list)[A-Za-z0-9_.-]*\.e$' .analysis/dex-strings.txt \
            | head -400 || true

          echo '=== video/card/lockup identifiers containing playlist/list ==='
          grep -Ei 'playlist|watch.?later|list[_-].*(video|lockup)|(video|lockup).*list' .analysis/dex-strings.txt \
            | grep -E '\.e$|eml$|cell|lockup|video' \
            | head -500 || true

          echo '=== nearby likely generic list row identifiers ==='
          grep -E '^(compact_video|video_with_context|video_lockup|.*video.*cell|.*lockup.*|.*thumbnail.*)\.e$' .analysis/dex-strings.txt \
            | head -500 || true

      - name: Remove proprietary APK bytes
        if: always()
        run: rm -rf .analysis/input .analysis/dex
