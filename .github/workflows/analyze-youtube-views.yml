name: Analyze YouTube feed view hooks

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-youtube-views.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Checkout acquisition helper
        uses: actions/checkout@v7
        with:
          repository: krishhari2105/morphe-builds
          path: .analysis/morphe-builds
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Acquire validated YouTube 21.16.256
        env:
          PYTHONPATH: ${{ github.workspace }}/.analysis/morphe-builds
        run: |
          python -m pip install --disable-pip-version-check requests >/dev/null
          mkdir -p .analysis/input
          python - <<'PY'
          from pathlib import Path
          from morphe_builder.apkmirror import ApkMirrorResolver
          from morphe_builder.models import AppConfig
          app=AppConfig(key='youtube',name='YouTube',package='com.google.android.youtube',apkmirror_url='https://www.apkmirror.com/apk/google-inc/youtube/',formats=('apk',),prefer=('universal',),target_abi='arm64-v8a')
          r=ApkMirrorResolver(min_request_interval=1.2,max_release_attempts=3,max_variant_attempts=8)
          out=Path('.analysis/input/youtube.apk')
          expected='724d2bf15d31dac98db00d82914db3876edf66e62fe2845001f204209ecf4c00'
          for url,ref in r.iter_candidates(app,'21.16.256'):
              try:
                  got=r.download_candidate(url,ref,out)
                  if got.sha256 == expected:
                      print('validated base', got.size, got.sha256)
                      break
                  out.unlink(missing_ok=True)
              except Exception as e:
                  print('candidate skipped:', e)
                  out.unlink(missing_ok=True)
          else: raise SystemExit('validated base not found')
          PY

      - name: Install JADX and decompile
        shell: bash
        run: |
          set -euo pipefail
          url="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest | jq -r '.assets[] | select(.name|startswith("jadx-") and endswith(".zip") and (contains("gui")|not)) | .browser_download_url' | head -1)"
          curl -fL --retry 3 "$url" -o .analysis/jadx.zip
          unzip -q .analysis/jadx.zip -d .analysis/jadx
          mkdir -p .analysis/decompiled
          set +e
          .analysis/jadx/bin/jadx --no-res --show-bad-code --threads-count 4 -d .analysis/decompiled .analysis/input/youtube.apk >/tmp/jadx2.log 2>&1
          rc=$?
          set -e
          echo "JADX exit=$rc; java files=$(find .analysis/decompiled/sources -type f -name '*.java' | wc -l)"
          test -d .analysis/decompiled/sources
          rm -f .analysis/input/youtube.apk

      - name: Map image request and mounted View candidates
        shell: bash
        run: |
          set -euo pipefail
          S=.analysis/decompiled/sources

          echo '=== fth URL-wrapper references (paths/lines only) ==='
          grep -R -n -E '\bfth\b' "$S/defpackage" 2>/dev/null | head -160 || true

          echo '=== ComponentHost references anywhere ==='
          grep -R -n -E 'ComponentHost|componentHost' "$S" 2>/dev/null | head -160 || true

          echo '=== View alpha call sites in obfuscated YouTube code ==='
          grep -R -n -E '\.setAlpha\(' "$S/defpackage" 2>/dev/null | head -220 || true

          echo '=== ImageView binding call sites in obfuscated YouTube code ==='
          grep -R -n -E '\.(setImageDrawable|setImageBitmap|setImageURI)\(' "$S/defpackage" 2>/dev/null | head -220 || true

          echo '=== classes coupling image URL/request and View/ImageView ==='
          python - <<'PY'
          from pathlib import Path
          root=Path('.analysis/decompiled/sources/defpackage')
          hits=[]
          for p in root.glob('*.java'):
              try: t=p.read_text(errors='ignore')
              except: continue
              urlish=('fth' in t or 'UrlRequest' in t or 'ImageRequest' in t)
              viewish=('ImageView' in t or 'setImageDrawable(' in t or 'setImageBitmap(' in t or 'android.view.View' in t)
              if urlish and viewish:
                  hits.append((p.name, t.count('ImageView'), t.count('fth'), t.count('setImageDrawable('), t.count('setImageBitmap(')))
          for row in hits[:120]: print(row)
          print('candidate_count=',len(hits))
          PY

      - name: Remove proprietary analysis inputs
        if: always()
        run: rm -rf .analysis/input .analysis/decompiled .analysis/jadx .analysis/jadx.zip
