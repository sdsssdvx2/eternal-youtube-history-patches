name: Analyze YouTube render path

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-youtube-render.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Checkout acquisition helper
        uses: actions/checkout@v7
        with:
          repository: krishhari2105/morphe-builds
          path: .analysis/morphe-builds
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install acquisition dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Acquire clean YouTube 21.16.256 APK privately
        env:
          PYTHONPATH: ${{ github.workspace }}/.analysis/morphe-builds
        run: |
          mkdir -p .analysis/input
          python - <<'PY'
          from pathlib import Path
          from morphe_builder.apkmirror import ApkMirrorResolver
          from morphe_builder.models import AppConfig

          app = AppConfig(
              key='youtube',
              name='YouTube',
              package='com.google.android.youtube',
              apkmirror_url='https://www.apkmirror.com/apk/google-inc/youtube/',
              formats=('apk',),
              prefer=('universal',),
              target_abi='arm64-v8a',
          )
          resolver = ApkMirrorResolver(min_request_interval=1.2, max_release_attempts=3, max_variant_attempts=8)
          dest = Path('.analysis/input/youtube.apk')
          errors = []
          expected = '724d2bf15d31dac98db00d82914db3876edf66e62fe2845001f204209ecf4c00'
          for url, referer in resolver.iter_candidates(app, '21.16.256'):
              try:
                  result = resolver.download_candidate(url, referer, dest)
                  print('Downloaded candidate:', result.size, 'bytes', result.sha256)
                  if result.sha256 != expected:
                      raise RuntimeError('Candidate is not the validated universal APK')
                  break
              except Exception as exc:
                  errors.append(str(exc))
                  if dest.exists(): dest.unlink()
          else:
              raise RuntimeError('APK acquisition failed: ' + ' | '.join(errors[-4:]))
          PY

      - name: Install JADX
        run: |
          python - <<'PY'
          import json, urllib.request
          data=json.load(urllib.request.urlopen('https://api.github.com/repos/skylot/jadx/releases/latest'))
          for a in data['assets']:
              if a['name'].startswith('jadx-') and a['name'].endswith('.zip') and 'gui' not in a['name'].lower():
                  print(a['browser_download_url'])
                  open('.analysis/jadx-url','w').write(a['browser_download_url'])
                  break
          else: raise SystemExit('JADX zip not found')
          PY
          curl -fL --retry 3 "$(cat .analysis/jadx-url)" -o .analysis/jadx.zip
          unzip -q .analysis/jadx.zip -d .analysis/jadx

      - name: Decompile enough for hook discovery
        shell: bash
        run: |
          mkdir -p .analysis/decompiled
          set +e
          .analysis/jadx/bin/jadx --no-res --show-bad-code --threads-count 4 -d .analysis/decompiled .analysis/input/youtube.apk >/tmp/jadx.log 2>&1
          rc=$?
          set -e
          tail -40 /tmp/jadx.log
          test -d .analysis/decompiled/sources
          count="$(find .analysis/decompiled/sources -type f -name '*.java' | wc -l)"
          echo "Decompiled Java files: $count (JADX exit code $rc)"
          test "$count" -gt 1000
          rm -f .analysis/input/youtube.apk

      - name: Locate Cronet image loader and Litho parser
        shell: bash
        run: |
          echo '=== image URL fingerprint candidates ==='
          grep -R -l -F "@#&=*+-_.,:!?()/~'%;$" .analysis/decompiled/sources | head -20 | tee /tmp/image-files || true
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "----- $f"
            grep -n -B20 -A80 -F "@#&=*+-_.,:!?()/~'%;$" "$f" | head -180 || true
          done < /tmp/image-files

          echo '=== Litho element parser candidates ==='
          grep -R -l -F 'Element missing correct type extension' .analysis/decompiled/sources | head -20 | tee /tmp/litho-files || true
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "----- $f"
            grep -n -B80 -A160 -F 'Element missing correct type extension' "$f" | head -320 || true
          done < /tmp/litho-files

          echo '=== ComponentHost / alpha-related candidates ==='
          grep -R -l -E 'ComponentHost|setAlpha\(' .analysis/decompiled/sources/com/google/android/apps/youtube 2>/dev/null | head -30 || true

      - name: Remove proprietary decompile tree
        if: always()
        run: rm -rf .analysis/input .analysis/decompiled .analysis/jadx .analysis/jadx.zip
