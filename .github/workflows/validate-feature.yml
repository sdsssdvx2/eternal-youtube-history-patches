name: Validate Watch Later controls

on:
  pull_request:
    paths:
      - 'pc-extension/**'
      - 'patches/**'
      - 'extensions/**'
      - '.github/workflows/validate-feature.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pc-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: PC self-tests and resident-renderer contract
        working-directory: pc-extension/src
        run: |
          set -euo pipefail
          node tests/watch-later-selftest.mjs
          node tests/static-integration-selftest.mjs
          node tests/page-profile-regression-selftest.mjs
          for f in *.js tests/*.mjs; do node --check "$f" >/dev/null; done
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const iso=m.content_scripts.find(x => x.world === 'ISOLATED');
          if (!iso) throw new Error('missing isolated-world content script');
          const js=iso.js||[];
          for (const required of ['content.js','pc-stability-controller.js','watch-later-recovery-content.js','maintenance.js']) {
            if (!js.includes(required)) throw new Error(`missing resident ${required}`);
          }
          for (const forbidden of ['surface-profiles.js','pc-ui-hotfix.js']) {
            if (js.includes(forbidden)) throw new Error(`regressed resident renderer ${forbidden}`);
          }
          for (const required of ['watch-later-safe-core.js','watch-later-safe.js','watch-later-safe-auto.js']) {
            if (!js.includes(required)) throw new Error(`missing safe coordinator ${required}`);
          }
          for (const f of ['watch-later-safe.js','watch-later-safe-auto.js']) {
            const s=fs.readFileSync(f,'utf8');
            if (/new\s+MutationObserver/.test(s)) throw new Error(`${f} reintroduced a whole-document observer`);
          }
          console.log('PASS PC manifest + one resident renderer + safe coordinators');
          NODE

  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Eternal patches
        uses: actions/checkout@v7
        with:
          path: eternal-youtube-history-patches
      - name: Checkout official Morphe patches
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patches
          ref: dev
          path: morphe-patches
      - name: Checkout Morphe patcher
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patcher
          path: morphe-patcher
      - name: Checkout Morphe patch library
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patches-library
          ref: dev
          path: morphe-patches-library
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Precompile official Morphe extension API
        working-directory: morphe-patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :extensions:youtube:compileReleaseJavaWithJavac --no-daemon --stacktrace
      - name: Compile Eternal Android extension and patch
        working-directory: eternal-youtube-history-patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :extensions:extension:compileReleaseJavaWithJavac \
                    :patches:compileKotlin \
                    --no-daemon --stacktrace
      - name: Cross-version structural smoke assertions
        working-directory: eternal-youtube-history-patches
        shell: bash
        run: |
          set -euo pipefail
          base='extensions/extension/src/main/java/app/morphe/extension/youtube/patches/eternalhistory'
          test -s "$base/EternalWatchLaterPayload.java"
          test -s "$base/EternalWatchLaterSafeCleaner.java"
          grep -F 'videos.size() == 1 && setIds.size() == 1' "$base/EternalWatchLaterPayload.java"
          grep -F 'listWatchLaterStrict(MAX_PAGES)' "$base/EternalWatchLaterSafeCleaner.java"
          grep -F 'declareWatchLaterJobService()' patches/src/main/kotlin/app/eternal/patches/youtube/history/AddOnSupport.kt
          echo 'PASS Android compile + conservative parser/safe-cleaner structure'

  android-patch-smoke:
    needs: android-compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Exact APK file hash for the current 20.51.39 universal/nodpi standalone Google APK.
      YT_TRUSTED_SHA256: 4cb1a507dad189b0eed01440cd6dba4c749c897dae2ff169d659c037bdfbda07
    steps:
      - name: Checkout Eternal feature branch
        uses: actions/checkout@v7
        with:
          path: eternal-youtube-history-patches
      - name: Checkout official Morphe patches source
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patches
          ref: dev
          path: morphe-patches
      - name: Checkout Morphe patcher
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patcher
          path: morphe-patcher
      - name: Checkout Morphe patch library
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patches-library
          ref: dev
          path: morphe-patches-library
      - name: Checkout production APK acquisition helper
        uses: actions/checkout@v7
        with:
          repository: krishhari2105/morphe-builds
          path: .validation/morphe-builds
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Precompile official Morphe extension API for bundle build
        working-directory: morphe-patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :extensions:youtube:compileReleaseJavaWithJavac --no-daemon --stacktrace
      - name: Build feature-branch Eternal patch bundle
        working-directory: eternal-youtube-history-patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :patches:generatePatchesList --no-daemon --stacktrace
          mkdir -p ../.validation/tools
          mapfile -t eternal_mpps < <(find patches/build/libs -maxdepth 1 -type f \
            -name 'patches-*.mpp' ! -name '*-javadoc.mpp' ! -name '*-sources.mpp' | sort)
          if [ "${#eternal_mpps[@]}" -ne 1 ]; then
            printf 'Expected exactly one runtime Eternal MPP, found %s:\n' "${#eternal_mpps[@]}" >&2
            printf '  %s\n' "${eternal_mpps[@]:-<none>}" >&2
            exit 1
          fi
          eternal_mpp="${eternal_mpps[0]}"
          test -s "$eternal_mpp"
          cp "$eternal_mpp" ../.validation/tools/eternal-feature.mpp
          echo "Feature runtime MPP: $eternal_mpp"
      - name: Acquire exact trusted standalone YouTube APK
        env:
          PYTHONPATH: ${{ github.workspace }}/.validation/morphe-builds
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests >/dev/null
          version="$(jq -r '.youtube.version' eternal-youtube-history-patches/android-update-status.json)"
          test "$version" = '20.51.39'
          mkdir -p .validation/input
          VERSION="$version" python - <<'PY'
          import os
          import zipfile
          from pathlib import Path
          from morphe_builder.apkmirror import ApkMirrorResolver
          from morphe_builder.models import AppConfig

          version = os.environ['VERSION']
          trusted = os.environ['YT_TRUSTED_SHA256'].strip().lower()
          app = AppConfig(
              key='youtube', name='YouTube', package='com.google.android.youtube',
              apkmirror_url='https://www.apkmirror.com/apk/google-inc/youtube/',
              formats=('apk',), prefer=('universal',), target_abi='arm64-v8a')
          resolver = ApkMirrorResolver(
              min_request_interval=1.2,
              max_release_attempts=4,
              max_variant_attempts=12)
          out = Path('.validation/input/youtube.apk')
          errors = []

          def validate_standalone(path: Path) -> None:
              with zipfile.ZipFile(path) as apk:
                  names = set(apk.namelist())
              required = {'AndroidManifest.xml', 'resources.arsc'}
              missing = required - names
              if missing:
                  raise RuntimeError('not a standalone APK; missing ' + ','.join(sorted(missing)))
              if not any(name == 'classes.dex' or (name.startswith('classes') and name.endswith('.dex')) for name in names):
                  raise RuntimeError('not a standalone APK; classes.dex missing')
              if any(name.lower().endswith(('.apk', '.apkm', '.xapk')) for name in names):
                  raise RuntimeError('bundle/container payload detected')

          for index, (url, referer) in enumerate(resolver.iter_candidates(app, version), start=1):
              try:
                  got = resolver.download_candidate(url, referer, out)
                  sha = got.sha256.lower()
                  print(f'candidate {index}: bytes={got.size} sha256={sha}')
                  validate_standalone(out)
                  if sha != trusted:
                      raise RuntimeError(f'standalone candidate hash does not match trusted base: {sha}')
                  print('selected exact trusted standalone candidate', referer)
                  break
              except Exception as exc:
                  errors.append(f'candidate {index}: {exc}')
                  out.unlink(missing_ok=True)
          else:
              raise RuntimeError('trusted base acquisition failed: ' + ' | '.join(errors[-8:]))
          PY
          echo "$YT_TRUSTED_SHA256  .validation/input/youtube.apk" | sha256sum -c -
      - name: Resolve Morphe Desktop and stable Morphe patches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          get_asset(){
            repo="$1" kind="$2" out="$3"
            release="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${repo}/releases/latest")"
            case "$kind" in
              desktop) api_url="$(jq -r '.assets[] | select(.name | startswith("morphe-desktop-") and endswith("-all.jar")) | .url' <<<"$release" | head -1)" ;;
              patches) api_url="$(jq -r '.assets[] | select((.name | startswith("patches-")) and (.name | endswith(".mpp")) and ((.name | contains("-javadoc")) | not) and ((.name | contains("-sources")) | not)) | .url' <<<"$release" | head -1)" ;;
              *) exit 2 ;;
            esac
            test -n "$api_url" && test "$api_url" != null
            curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' "$api_url" -o "$out"
          }
          get_asset MorpheApp/morphe-desktop desktop .validation/tools/morphe-desktop.jar
          get_asset MorpheApp/morphe-patches patches .validation/tools/morphe.mpp
      - name: Apply feature Eternal patch to supported YouTube APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .validation/out
          java -Xmx5g -jar .validation/tools/morphe-desktop.jar patch \
            -p .validation/tools/morphe.mpp \
            -p .validation/tools/eternal-feature.mpp -e 'Eternal YouTube History' \
            -o .validation/out/youtube.apk \
            -r .validation/out/result.json \
            .validation/input/youtube.apk
          test -s .validation/out/youtube.apk
          test -s .validation/out/result.json
          cat .validation/out/result.json
          echo 'PASS feature patch application smoke test'
      - name: Remove proprietary APKs and ephemeral tools
        if: always()
        run: rm -rf .validation/input .validation/out .validation/tools
