name: Validate Watch Later controls

on:
  pull_request:
    paths:
      - 'pc-extension/**'
      - 'patches/**'
      - 'extensions/**'
      - '.github/workflows/validate-feature.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pc-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: PC stability, Watch Later and recovery self-tests
        working-directory: pc-extension/src
        run: |
          set -euo pipefail
          node tests/watch-later-selftest.mjs
          node tests/static-integration-selftest.mjs
          node tests/page-profile-regression-selftest.mjs
          node tests/watch-later-recovery-selftest.mjs
          node tests/watch-later-recovery-static-selftest.mjs
          for f in *.js tests/*.mjs; do node --check "$f" >/dev/null; done
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          if(m.version!=='0.10.7') throw new Error(`unexpected version ${m.version}`);
          const iso=m.content_scripts.find(x=>x.world==='ISOLATED');
          if(!iso) throw new Error('missing ISOLATED content scripts');
          if(!iso.js.includes('content.js') || !iso.js.includes('pc-stability-guard.js')) throw new Error('missing stable renderer/guard');
          if(iso.js.includes('surface-profiles.js') || iso.js.includes('pc-ui-hotfix.js')) throw new Error('competing presentation scripts re-enabled');
          console.log('PASS manifest single-owner stability architecture');
          NODE
          echo 'PASS PC stability + Watch Later recovery safety'

  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Eternal patches
        uses: actions/checkout@v7
        with:
          path: eternal-youtube-history-patches
      - name: Checkout official Morphe patches
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patches
          ref: dev
          path: morphe-patches
      - name: Checkout Morphe patcher
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patcher
          path: morphe-patcher
      - name: Checkout Morphe patch library
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patches-library
          ref: dev
          path: morphe-patches-library
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Precompile official Morphe extension API
        working-directory: morphe-patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :extensions:youtube:compileReleaseJavaWithJavac --no-daemon --stacktrace
      - name: Compile Eternal Android extension and patch
        working-directory: eternal-youtube-history-patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :extensions:extension:compileReleaseJavaWithJavac :patches:compileKotlin --no-daemon --stacktrace
      - name: Static stability and destructive-action safety assertions
        working-directory: eternal-youtube-history-patches
        shell: bash
        run: |
          set -euo pipefail
          base='extensions/extension/src/main/java/app/morphe/extension/youtube/patches/eternalhistory'
          settings="$base/EternalHistorySettings.java"
          safety="$base/EternalWatchLaterSafety.java"
          coordinator="$base/EternalCleanupCoordinator.java"
          safe_cleaner="$base/EternalWatchLaterSafeCleaner.java"
          safe_undo="$base/EternalWatchLaterSafeUndo.java"
          tx_store="$base/EternalWatchLaterTransactionStore.java"
          tracker="$base/EternalSurfaceTracker.java"
          toolbar="$base/EternalHistoryToolbar.java"
          filter="$base/EternalWatchedFilter.java"
          surface="$base/EternalSurfaceSettings.java"
          support='patches/src/main/kotlin/app/eternal/patches/youtube/history/AddOnSupport.kt'

          # Data-loss protection remains fail-closed.
          grep -F 'DESTRUCTIVE_CLEANUP_LOCKED = true' "$safety"
          grep -F 'new BooleanSetting("morphe_eternal_history_watch_later_auto_cleanup", FALSE' "$settings"
          grep -F 'EternalWatchLaterSafeCleaner.previewAndConfirmCleanup(activity)' "$coordinator"
          grep -F 'EternalWatchLaterSafeUndo.undoLastCleanup(activity)' "$coordinator"
          grep -F 'listWatchLaterStrict(MAX_PAGES)' "$safe_cleaner"
          grep -F 'pageTokens.size() != 1' "$safe_cleaner"
          grep -F '!consumedTokens.add(next)' "$safe_cleaner"
          grep -F 'sameMembership(originalSnapshot, confirmed.entries)' "$safe_cleaner"
          grep -F 'candidate.put("status", "attempting")' "$safe_cleaner"
          grep -F 'Entry finalFresh = resolveEntryStrict(videoId)' "$safe_cleaner"
          grep -F 'removeFreshEntry(finalFresh)' "$safe_cleaner"
          grep -F 'static final int SCHEMA = 2' "$tx_store"
          grep -F 'containsDeleteRisk(current)' "$tx_store"
          grep -F 'EternalWatchLaterTransactionStore.shouldRestore(candidate)' "$safe_undo"

          python - <<'PY'
          from pathlib import Path
          p=Path('extensions/extension/src/main/java/app/morphe/extension/youtube/patches/eternalhistory/EternalWatchLaterSafeCleaner.java').read_text()
          save=p.index('durable = EternalWatchLaterTransactionStore.saveVerified(tx)')
          reread=p.index('ListResult confirmed = listWatchLaterStrict(MAX_PAGES)', save)
          compare=p.index('sameMembership(originalSnapshot, confirmed.entries)', reread)
          removing=p.index('durable.put("state", "removing")', compare)
          assert save < reread < compare < removing
          attempting=p.index('candidate.put("status", "attempting")')
          persist=p.index('durable = EternalWatchLaterTransactionStore.saveVerified(durable)', attempting)
          final_resolve=p.index('Entry finalFresh = resolveEntryStrict(videoId)', persist)
          delete=p.index('removeFreshEntry(finalFresh)', final_resolve)
          result=p.index('durable = persistResult(durable)', delete)
          assert attempting < persist < final_resolve < delete < result
          print('PASS Android manual transaction ordering assertions')
          PY

          # Real-device stabilization: injected ABI remains, but navigation/view callbacks are no-op.
          grep -F 'public static void onBrowseId' "$tracker"
          grep -F 'static void onNavigationChanged' "$tracker"
          ! grep -F 'publishSurface' "$tracker"
          ! grep -F 'lastUiSurface' "$tracker"
          ! grep -F 'getSelectedNavigationButton' "$tracker"
          ! grep -F 'PlayerType' "$tracker"
          ! grep -F 'NavigationBar.is' "$tracker"

          grep -F 'public static void onToolbarImageView' "$toolbar"
          grep -F 'static void onSurfaceChanged()' "$toolbar"
          grep -F 'static void ensureControlSoon()' "$toolbar"
          ! grep -F 'root.addView' "$toolbar"
          ! grep -F 'findViewById' "$toolbar"
          ! grep -F 'RecyclerView' "$toolbar"
          ! grep -F 'AlertDialog' "$toolbar"

          # Presentation uses common defaults only and excludes Shorts using pure component data.
          grep -F 'EternalSurfaceSettings.defaultProfile(false)' "$filter"
          grep -F 'looksLikeShortsComponent(path)' "$filter"
          grep -F 'lower.contains("shorts") || lower.contains("reel")' "$filter"
          ! grep -F 'EternalSurfaceTracker.forComponent' "$filter"
          grep -F 'ensureDefaultProfileMigrated()' "$surface"

          # Keep binary compatibility for existing injected call sites while their targets remain harmless.
          grep -F 'EternalBrowseIdFingerprint' "$support"
          grep -F 'onBrowseId(Ljava/lang/String;)V' "$support"
          grep -F 'installEternalToolbarHook()' "$support"
          echo 'PASS Android navigation/view no-op stability + transactional safety'

  android-patch-smoke:
    needs: android-compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Eternal feature branch
        uses: actions/checkout@v7
        with:
          path: eternal-youtube-history-patches
      - name: Checkout official Morphe patches source
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patches
          ref: dev
          path: morphe-patches
      - name: Checkout Morphe patcher
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patcher
          path: morphe-patcher
      - name: Checkout Morphe patch library
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patches-library
          ref: dev
          path: morphe-patches-library
      - name: Checkout APK acquisition helper
        uses: actions/checkout@v7
        with:
          repository: krishhari2105/morphe-builds
          path: .validation/morphe-builds
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Precompile official Morphe extension API for bundle build
        working-directory: morphe-patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :extensions:youtube:compileReleaseJavaWithJavac --no-daemon --stacktrace
      - name: Build feature-branch Eternal patch bundle
        working-directory: eternal-youtube-history-patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :patches:generatePatchesList --no-daemon --stacktrace
          mkdir -p ../.validation/tools
          eternal_mpp="$(find patches/build/libs -maxdepth 1 -type f -name 'patches-*.mpp' | sort | head -1)"
          test -n "$eternal_mpp" && test -s "$eternal_mpp"
          cp "$eternal_mpp" ../.validation/tools/eternal-feature.mpp
          echo "Feature MPP: $eternal_mpp"
      - name: Acquire current supported clean YouTube APK
        env:
          PYTHONPATH: ${{ github.workspace }}/.validation/morphe-builds
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests >/dev/null
          version="$(jq -r '.youtube.version' eternal-youtube-history-patches/android-update-status.json)"
          mkdir -p .validation/input
          VERSION="$version" python - <<'PY'
          import os, zipfile
          from pathlib import Path
          from morphe_builder.apkmirror import ApkMirrorResolver
          from morphe_builder.models import AppConfig
          version=os.environ['VERSION']
          app=AppConfig(
              key='youtube', name='YouTube', package='com.google.android.youtube',
              apkmirror_url='https://www.apkmirror.com/apk/google-inc/youtube/',
              formats=('apk',), prefer=('universal','arm64-v8a'), target_abi='arm64-v8a')
          resolver=ApkMirrorResolver(min_request_interval=1.2,max_release_attempts=3,max_variant_attempts=10)
          out=Path('.validation/input/youtube.apk')
          errors=[]
          for url,referer in resolver.iter_candidates(app,version):
              try:
                  got=resolver.download_candidate(url,referer,out)
                  with zipfile.ZipFile(out) as z:
                      names=set(z.namelist())
                  if 'AndroidManifest.xml' not in names or 'resources.arsc' not in names:
                      raise RuntimeError('candidate is not a standalone patchable APK')
                  print('selected standalone candidate',got.size,got.sha256,referer)
                  break
              except Exception as exc:
                  errors.append(str(exc)); out.unlink(missing_ok=True)
          else:
              raise RuntimeError('base acquisition failed: '+' | '.join(errors[-6:]))
          PY
      - name: Resolve Morphe Desktop and stable Morphe patches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          get_asset(){
            repo="$1" kind="$2" out="$3"
            release="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${repo}/releases/latest")"
            case "$kind" in
              desktop) api_url="$(jq -r '.assets[] | select(.name | startswith("morphe-desktop-") and endswith("-all.jar")) | .url' <<<"$release" | head -1)" ;;
              patches) api_url="$(jq -r '.assets[] | select(.name | startswith("patches-") and endswith(".mpp")) | .url' <<<"$release" | head -1)" ;;
              *) exit 2 ;;
            esac
            test -n "$api_url" && test "$api_url" != null
            curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' "$api_url" -o "$out"
          }
          get_asset MorpheApp/morphe-desktop desktop .validation/tools/morphe-desktop.jar
          get_asset MorpheApp/morphe-patches patches .validation/tools/morphe.mpp
      - name: Apply feature Eternal patch to supported YouTube APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .validation/out
          java -Xmx5g -jar .validation/tools/morphe-desktop.jar patch \
            -p .validation/tools/morphe.mpp \
            -p .validation/tools/eternal-feature.mpp -e 'Eternal YouTube History' \
            -o .validation/out/youtube.apk \
            -r .validation/out/result.json \
            .validation/input/youtube.apk
          test -s .validation/out/youtube.apk
          test -s .validation/out/result.json
          grep -F 'Eternal YouTube History' .validation/out/result.json >/dev/null || true
          cat .validation/out/result.json
          echo 'PASS feature patch application smoke test'
      - name: Remove proprietary APKs and ephemeral tools
        if: always()
        run: rm -rf .validation/input .validation/out .validation/tools
