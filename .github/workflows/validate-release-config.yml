name: Validate release publishing

on:
  pull_request:
    paths:
      - '.releaserc*'
      - '.github/scripts/set_gradle_version.py'
      - '.github/workflows/release.yml'
      - '.github/workflows/validate-release-config.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-config:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Eternal patches
        uses: actions/checkout@v7
        with:
          path: eternal-youtube-history-patches
      - name: Checkout official Morphe patches
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patches
          ref: dev
          path: morphe-patches
      - name: Checkout Morphe patcher
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patcher
          path: morphe-patcher
      - name: Checkout Morphe patch library
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patches-library
          ref: dev
          path: morphe-patches-library
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate release config and version setter
        working-directory: eternal-youtube-history-patches
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool .releaserc >/dev/null
          if grep -F '"gradle-semantic-release-plugin"' .releaserc; then
            echo 'gradle-semantic-release-plugin must not be active in semantic-release publish.' >&2
            exit 1
          fi

          cp gradle.properties /tmp/gradle.properties.original
          python3 .github/scripts/set_gradle_version.py 9.8.7
          test "$(sed -nE 's/^version[[:space:]]*=[[:space:]]*(.+)$/\1/p' gradle.properties | tr -d '[:space:]')" = '9.8.7'
          cp /tmp/gradle.properties.original gradle.properties

          grep -F 'gh release create "$latest_tag" "$asset"' .github/workflows/release.yml
          grep -F 'Refusing recovery: latest tag is $latest_tag but gradle.properties is $gradle_version' .github/workflows/release.yml
          grep -F 'python3 .github/scripts/set_gradle_version.py ${nextRelease.version}' .releaserc
          echo 'PASS release configuration safety checks'
      - name: Precompile official Morphe extension API
        working-directory: morphe-patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :extensions:youtube:compileReleaseJavaWithJavac --no-daemon --stacktrace
      - name: Build release artifact without Gradle publish
        working-directory: eternal-youtube-history-patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*(.+)$/\1/p' gradle.properties | head -1 | tr -d '[:space:]')"
          ./gradlew :patches:generatePatchesList --no-daemon --stacktrace
          asset="$(find patches/build/libs -maxdepth 1 -type f -name "patches-${version}.mpp" -print -quit)"
          test -n "$asset" && test -s "$asset"
          echo "PASS release artifact: $asset ($(stat -c %s "$asset") bytes)"
