name: Validate server-side app patching

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-server-patch.yml'

permissions:
  contents: read

jobs:
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      YT_TRUSTED_SHA256: 4b3ca9de0eb6857d43fa8766a724a2eba6405dfdbcdfb20eef6cb8950e805e2c
    steps:
      - uses: actions/checkout@v7

      - name: Checkout APK acquisition helper
        uses: actions/checkout@v7
        with:
          repository: krishhari2105/morphe-builds
          path: .server-test/morphe-builds
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install acquisition dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Acquire exact trusted clean YouTube APK
        env:
          PYTHONPATH: ${{ github.workspace }}/.server-test/morphe-builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .server-test/input
          version="$(jq -r '.youtube.version' android-update-status.json)"
          test "$version" = '21.20.405'
          VERSION="$version" python - <<'PY'
          import os
          import zipfile
          from pathlib import Path
          from morphe_builder.apkmirror import ApkMirrorResolver
          from morphe_builder.models import AppConfig

          version = os.environ['VERSION']
          trusted = os.environ['YT_TRUSTED_SHA256'].strip().lower()
          app = AppConfig(
              key='youtube', name='YouTube', package='com.google.android.youtube',
              apkmirror_url='https://www.apkmirror.com/apk/google-inc/youtube/',
              formats=('apk',), prefer=('universal',), target_abi='arm64-v8a')
          resolver = ApkMirrorResolver(min_request_interval=1.2, max_release_attempts=4, max_variant_attempts=12)
          dest = Path('.server-test/input/youtube.apk')
          errors = []

          def validate_standalone(path: Path) -> None:
              with zipfile.ZipFile(path) as apk:
                  names = set(apk.namelist())
              if 'AndroidManifest.xml' not in names or 'resources.arsc' not in names:
                  raise RuntimeError('candidate is not a standalone APK')
              if not any(name == 'classes.dex' or (name.startswith('classes') and name.endswith('.dex')) for name in names):
                  raise RuntimeError('candidate has no classes dex')

          for index, (url, referer) in enumerate(resolver.iter_candidates(app, version), start=1):
              try:
                  result = resolver.download_candidate(url, referer, dest)
                  print('candidate', index, result.size, result.sha256)
                  validate_standalone(dest)
                  if result.sha256.lower() != trusted:
                      raise RuntimeError('candidate hash does not match trusted base')
                  print('validated trusted standalone APK selected', referer)
                  break
              except Exception as exc:
                  errors.append(str(exc))
                  dest.unlink(missing_ok=True)
          else:
              raise RuntimeError('base acquisition failed: ' + ' | '.join(errors[-6:]))
          PY
          echo "$YT_TRUSTED_SHA256  .server-test/input/youtube.apk" | sha256sum -c -

      - name: Resolve and download Morphe Desktop and patch bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .server-test/tools
          get_asset() {
            local repo="$1" regex="$2" out="$3"
            url="$(curl -fsSL "https://api.github.com/repos/${repo}/releases/latest" | jq -r --arg re "$regex" '.assets[] | select(.name|test($re)) | .browser_download_url' | head -1)"
            test -n "$url" && test "$url" != null
            curl -fL --retry 3 "$url" -o "$out"
          }
          get_asset MorpheApp/morphe-desktop '^morphe-desktop-.*-all\.jar$' .server-test/tools/morphe-desktop.jar
          get_asset MorpheApp/morphe-patches '^patches-.*\.mpp$' .server-test/tools/morphe.mpp
          get_asset sdsssdvx2/eternal-youtube-history-patches '^patches-.*\.mpp$' .server-test/tools/eternal.mpp
          ls -lh .server-test/tools

      - name: Patch pinned YouTube with released Eternal source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .server-test/out
          version="$(jq -r '.youtube.version' android-update-status.json)"
          java -Xmx5g -jar .server-test/tools/morphe-desktop.jar patch \
            -p .server-test/tools/morphe.mpp \
            -p .server-test/tools/eternal.mpp -e 'Eternal YouTube History' \
            -o .server-test/out/youtube-morphe-eternal.apk \
            -r .server-test/out/result.json \
            .server-test/input/youtube.apk
          test -s .server-test/out/youtube-morphe-eternal.apk
          test -s .server-test/out/result.json
          cat .server-test/out/result.json
          jq -e --arg version "$version" '
            .success == true
            and .packageName == "com.google.android.youtube"
            and .packageVersion == $version
            and ((.appliedPatches // []) | index("Eternal YouTube History") != null)
            and ((.failedPatches // []) | length == 0)
          ' .server-test/out/result.json >/dev/null
          echo "PASS released Eternal actually applied to trusted YouTube $version"
          echo "output bytes: $(stat -c%s .server-test/out/youtube-morphe-eternal.apk)"

      - name: Remove proprietary APKs and ephemeral signing material
        if: always()
        run: rm -rf .server-test/input .server-test/out .server-test/tools
