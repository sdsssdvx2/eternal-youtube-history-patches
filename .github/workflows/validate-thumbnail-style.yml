name: Validate thumbnail-only watched styling

on:
  push:
    branches:
      - feat-thumbnail-style-20261012
    paths:
      - '.github/workflows/validate-thumbnail-style.yml'
      - 'extensions/**'
      - 'patches/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/validate-thumbnail-style.yml'
      - 'extensions/**'
      - 'patches/**'

permissions:
  contents: read

jobs:
  validate:
    # Compile Eternal and patch the current stable Morphe YouTube base before merge.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Eternal branch
        uses: actions/checkout@v7
        with:
          path: eternal-youtube-history-patches
          fetch-depth: 0

      - name: Checkout official Morphe stable patches
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patches
          ref: v1.47.0
          path: morphe-patches
          fetch-depth: 1

      - name: Checkout Morphe patcher
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patcher
          path: morphe-patcher
          fetch-depth: 1

      - name: Checkout Morphe patch library
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patches-library
          ref: dev
          path: morphe-patches-library
          fetch-depth: 1

      - name: Checkout APK acquisition helper
        uses: actions/checkout@v7
        with:
          repository: krishhari2105/morphe-builds
          path: morphe-builds
          fetch-depth: 1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Precompile official Morphe extension API
        working-directory: morphe-patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :extensions:youtube:compileReleaseKotlin \
                    :extensions:youtube:compileReleaseJavaWithJavac \
                    --no-daemon --stacktrace

      - name: Compile and package Eternal branch
        working-directory: eternal-youtube-history-patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :extensions:extension:assembleRelease :patches:build --no-daemon --stacktrace
          echo '--- Eternal build outputs ---'
          find patches/build extensions/extension/build -type f \( -name '*.mpp' -o -name '*.mpe' -o -name '*.apk' \) -print || true
          test -n "$(find patches/build -type f -name '*.mpp' -print -quit)"

      - name: Acquire standalone YouTube 21.20.405
        working-directory: eternal-youtube-history-patches
        env:
          PYTHONPATH: ${{ github.workspace }}/morphe-builds
        run: |
          python -m pip install --disable-pip-version-check requests >/dev/null
          mkdir -p .validation/input
          python - <<'PY'
          import zipfile
          from pathlib import Path
          from morphe_builder.apkmirror import ApkMirrorResolver
          from morphe_builder.models import AppConfig
          app=AppConfig(key='youtube',name='YouTube',package='com.google.android.youtube',apkmirror_url='https://www.apkmirror.com/apk/google-inc/youtube/',formats=('apk',),prefer=('universal','arm64-v8a'),target_abi='arm64-v8a')
          resolver=ApkMirrorResolver(min_request_interval=1.2,max_release_attempts=4,max_variant_attempts=12)
          out=Path('.validation/input/youtube.apk')
          errors=[]
          for index,(url,ref) in enumerate(resolver.iter_candidates(app,'21.20.405'),1):
              try:
                  got=resolver.download_candidate(url,ref,out)
                  with zipfile.ZipFile(out) as z:
                      names=set(z.namelist())
                  if 'AndroidManifest.xml' not in names or 'resources.arsc' not in names:
                      raise RuntimeError('not a standalone APK')
                  if not any(n == 'classes.dex' or (n.startswith('classes') and n.endswith('.dex')) for n in names):
                      raise RuntimeError('classes.dex missing')
                  if any(n.lower().endswith(('.apk','.apkm','.xapk')) for n in names):
                      raise RuntimeError('bundle/container payload detected')
                  print('selected', index, got.size, got.sha256, ref)
                  break
              except Exception as exc:
                  errors.append(f'{index}: {exc}')
                  out.unlink(missing_ok=True)
          else:
              raise RuntimeError('base acquisition failed: ' + ' | '.join(errors[-8:]))
          PY

      - name: Download Morphe Desktop and stable Morphe bundle
        working-directory: eternal-youtube-history-patches
        run: |
          set -euo pipefail
          mkdir -p .validation/tools .validation/out
          desktop="$(curl -fsSL https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest | jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url' | head -1)"
          morphe="$(curl -fsSL https://api.github.com/repos/MorpheApp/morphe-patches/releases/tags/v1.47.0 | jq -r '.assets[] | select(.name | startswith("patches-") and endswith(".mpp")) | .browser_download_url' | head -1)"
          curl -fL --retry 3 "$desktop" -o .validation/tools/morphe-desktop.jar
          curl -fL --retry 3 "$morphe" -o .validation/tools/morphe.mpp
          cp "$(find patches/build -type f -name '*.mpp' -print -quit)" .validation/tools/eternal.mpp

      - name: Patch 21.20.405 with branch Eternal source
        working-directory: eternal-youtube-history-patches
        run: |
          set -euo pipefail
          java -Xmx5g -jar .validation/tools/morphe-desktop.jar patch \
            -p .validation/tools/morphe.mpp \
            -p .validation/tools/eternal.mpp \
            -e 'Eternal YouTube History' \
            -o .validation/out/youtube-morphe-eternal.apk \
            -r .validation/out/result.json \
            .validation/input/youtube.apk
          test -s .validation/out/youtube-morphe-eternal.apk
          cat .validation/out/result.json

      - name: Cleanup proprietary files
        if: always()
        working-directory: eternal-youtube-history-patches
        run: rm -rf .validation
