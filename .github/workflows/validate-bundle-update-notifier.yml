name: Validate bundle update notifier

on:
  push:
    branches:
      - feat-bundle-update-notifier-20261012
    paths:
      - '.github/workflows/validate-bundle-update-notifier.yml'
      - 'extensions/**'
      - 'patches/**'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Eternal branch
        uses: actions/checkout@v7
        with:
          path: eternal-youtube-history-patches
          fetch-depth: 0

      - name: Checkout official Morphe patches
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patches
          ref: dev
          path: morphe-patches
          fetch-depth: 1

      - name: Checkout Morphe patcher
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patcher
          path: morphe-patcher
          fetch-depth: 1

      - name: Checkout Morphe patch library
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patches-library
          ref: dev
          path: morphe-patches-library
          fetch-depth: 1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Precompile official Morphe extension API
        working-directory: morphe-patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :extensions:youtube:compileReleaseKotlin \
                    :extensions:youtube:compileReleaseJavaWithJavac \
                    --no-daemon --stacktrace

      - name: Compile Eternal extension and patches
        working-directory: eternal-youtube-history-patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :extensions:extension:assembleRelease :patches:compileKotlin --no-daemon --stacktrace
