name: Analyze Litho style alpha

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-litho-style.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: krishhari2105/morphe-builds
          path: .analysis/morphe-builds
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Acquire validated YouTube base
        env:
          PYTHONPATH: ${{ github.workspace }}/.analysis/morphe-builds
        run: |
          python -m pip install --disable-pip-version-check requests >/dev/null
          mkdir -p .analysis/input
          python - <<'PY'
          from pathlib import Path
          from morphe_builder.apkmirror import ApkMirrorResolver
          from morphe_builder.models import AppConfig
          app=AppConfig(key='youtube',name='YouTube',package='com.google.android.youtube',apkmirror_url='https://www.apkmirror.com/apk/google-inc/youtube/',formats=('apk',),prefer=('universal',),target_abi='arm64-v8a')
          r=ApkMirrorResolver(min_request_interval=1.2,max_release_attempts=3,max_variant_attempts=8)
          out=Path('.analysis/input/youtube.apk'); expected='724d2bf15d31dac98db00d82914db3876edf66e62fe2845001f204209ecf4c00'
          for url,ref in r.iter_candidates(app,'21.16.256'):
              try:
                  got=r.download_candidate(url,ref,out)
                  if got.sha256 == expected: break
                  out.unlink(missing_ok=True)
              except Exception: out.unlink(missing_ok=True)
          else: raise SystemExit('validated base not found')
          PY
      - name: Decompile
        shell: bash
        run: |
          set -euo pipefail
          url="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest | jq -r '.assets[] | select(.name|startswith("jadx-") and endswith(".zip") and (contains("gui")|not)) | .browser_download_url' | head -1)"
          curl -fL --retry 3 "$url" -o .analysis/jadx.zip
          unzip -q .analysis/jadx.zip -d .analysis/jadx
          mkdir -p .analysis/decompiled
          .analysis/jadx/bin/jadx --no-res --show-bad-code --threads-count 4 -d .analysis/decompiled .analysis/input/youtube.apk >/tmp/jadx-style.log 2>&1 || true
          test -d .analysis/decompiled/sources/defpackage
          rm -f .analysis/input/youtube.apk
      - name: Inspect component common-props alpha path
        shell: bash
        run: |
          set -euo pipefail
          D=.analysis/decompiled/sources/defpackage
          echo '===== gec common-props accessor ====='
          grep -n -B25 -A55 -E 'public final gdy k\(| gdy k\(' "$D/gec.java" || true
          echo '===== gdy full signatures and NodeInfo access ====='
          grep -n -E 'class gdy|gij|public|final| F\(| k\(' "$D/gdy.java" | head -500 || true
          grep -n -B35 -A75 -E 'gij F\(|public final gij|new gij' "$D/gdy.java" || true
          echo '===== gdz wrapper around component ====='
          sed -n '1,260p' "$D/gdz.java" || true
          echo '===== tqu build tail ====='
          sed -n '400,490p' "$D/tqu.java" || true
          echo '===== callers using component.k().F() ====='
          grep -R -n -F '.k().F()' "$D" | head -250 || true
          echo '===== callers setting static alpha on nodeinfo/common props ====='
          grep -R -n -E '\.F\(\)\.g\(|gijVar\.g\(' "$D" | head -250 || true
          echo '===== tvw direct component transforms ====='
          sed -n '210,275p' "$D/tvw.java" || true
      - name: Cleanup
        if: always()
        run: rm -rf .analysis/input .analysis/decompiled .analysis/jadx .analysis/jadx.zip
