name: Release
on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
    paths:
      - 'patches/**'
      - 'extensions/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'package.json'
      - 'package-lock.json'
      - '.releaserc*'
      - '.github/scripts/set_gradle_version.py'
      - '.github/workflows/release.yml'

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Eternal patches
        uses: actions/checkout@v7
        with:
          path: eternal-youtube-history-patches
          fetch-depth: 0

      - name: Resolve latest stable Morphe patch release
        id: morphe
        shell: bash
        run: |
          set -euo pipefail
          tag="$(curl -fsSL https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest | jq -r '.tag_name')"
          test -n "$tag" && test "$tag" != null
          echo "ref=$tag" >> "$GITHUB_OUTPUT"
          echo "Release compile will use Morphe stable $tag"

      - name: Checkout official stable Morphe patches
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patches
          ref: ${{ steps.morphe.outputs.ref }}
          path: morphe-patches
      - name: Checkout Morphe patcher
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patcher
          path: morphe-patcher
      - name: Checkout Morphe patch library
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patches-library
          ref: dev
          path: morphe-patches-library
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Install npm dependencies
        working-directory: eternal-youtube-history-patches
        run: npm install
      - name: Precompile official stable Morphe extension API
        working-directory: morphe-patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :extensions:youtube:compileReleaseJavaWithJavac \
                    --no-daemon --stacktrace
      - name: Compile Eternal patches directly
        working-directory: eternal-youtube-history-patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :extensions:extension:compileReleaseJavaWithJavac \
                    :patches:compileKotlin \
                    --no-daemon --stacktrace
      - name: Release
        working-directory: eternal-youtube-history-patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx semantic-release 2>&1 | tee /tmp/semantic-release.log
      - name: Recover a tagged release missing its GitHub Release object
        if: github.ref == 'refs/heads/main'
        working-directory: eternal-youtube-history-patches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)"
          test -n "$latest_tag"

          if gh release view "$latest_tag" >/dev/null 2>&1; then
            echo "GitHub Release already exists for $latest_tag; recovery is not needed."
            exit 0
          fi

          version="${latest_tag#v}"
          main_gradle_version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*(.+)$/\1/p' gradle.properties | head -1 | tr -d '[:space:]')"
          if [[ "$main_gradle_version" != "$version" ]]; then
            echo "Refusing recovery: latest tag is $latest_tag but gradle.properties is $main_gradle_version" >&2
            exit 1
          fi

          echo "Recovering missing GitHub Release for $latest_tag from the exact tagged source."
          git checkout --detach "$latest_tag"

          tagged_gradle_version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*(.+)$/\1/p' gradle.properties | head -1 | tr -d '[:space:]')"
          if [[ "$tagged_gradle_version" != "$version" ]]; then
            echo "Refusing recovery: tagged source $latest_tag contains Gradle version $tagged_gradle_version" >&2
            exit 1
          fi

          ./gradlew :patches:generatePatchesList --no-daemon --stacktrace

          asset="$(find patches/build/libs -maxdepth 1 -type f -name "patches-${version}.mpp" -print -quit)"
          if [[ -z "$asset" ]]; then
            candidate="$(find patches/build/libs -maxdepth 1 -type f -name 'patches-*.mpp' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
            test -n "$candidate" && test -s "$candidate"
            asset="patches/build/libs/patches-${version}.mpp"
            cp "$candidate" "$asset"
          fi
          test -s "$asset"

          gh release create "$latest_tag" "$asset" \
            --verify-tag \
            --title "$latest_tag" \
            --generate-notes

          gh release view "$latest_tag" --json tagName,assets --jq \
            '.tagName + " " + (.assets | map(.name) | join(","))'
          echo "Recovered GitHub Release $latest_tag with $(basename "$asset") built from the tagged source."
