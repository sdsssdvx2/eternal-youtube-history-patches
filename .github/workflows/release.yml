name: Release
on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - 'ci/last-semantic-release.log'

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Eternal patches
        uses: actions/checkout@v7
        with:
          path: eternal-youtube-history-patches
          fetch-depth: 0
      - name: Checkout official Morphe patches
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patches
          ref: dev
          path: morphe-patches
      - name: Checkout Morphe patcher
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patcher
          path: morphe-patcher
      - name: Checkout Morphe patch library
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patches-library
          ref: dev
          path: morphe-patches-library
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Install npm dependencies
        working-directory: eternal-youtube-history-patches
        run: npm install
      - name: Precompile official Morphe extension API
        working-directory: morphe-patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :extensions:youtube:compileReleaseKotlin \
                    :extensions:youtube:compileReleaseJavaWithJavac \
                    --no-daemon --stacktrace
      - name: Diagnose Eternal source checkout
        working-directory: eternal-youtube-history-patches
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          TARGET=patches/src/main/kotlin/app/eternal/patches/youtube/history/AddOnSupport.kt
          sha256sum "$TARGET"
          find . -name AddOnSupport.kt -print
          echo '--- forbidden helper symbols (should be empty) ---'
          grep -RInE 'titleKey|summaryKey|Sorting|sortBy' patches/src/main/kotlin || true
      - name: Compile Eternal patches directly
        working-directory: eternal-youtube-history-patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:compileKotlin --no-daemon --stacktrace
      - name: Release
        id: semantic
        continue-on-error: true
        working-directory: eternal-youtube-history-patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          npx semantic-release > /tmp/semantic-release.log 2>&1
          code=$?
          mkdir -p ci
          if [ "$code" -ne 0 ]; then
            {
              echo "semantic-release exit code: $code"
              echo
              tail -n 220 /tmp/semantic-release.log
            } > ci/last-semantic-release.log
          else
            rm -f ci/last-semantic-release.log
          fi
          exit "$code"
      - name: Save release failure diagnostic
        if: steps.semantic.outcome == 'failure'
        working-directory: eternal-youtube-history-patches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset
          git add ci/last-semantic-release.log
          git commit -m 'ci: capture semantic-release failure [skip ci]'
          git push
      - name: Fail workflow if release failed
        if: steps.semantic.outcome == 'failure'
        run: exit 1
