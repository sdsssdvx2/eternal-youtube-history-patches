name: Validate Eternal maintenance

on:
  pull_request:
    paths:
      - 'pc-extension/**'
      - 'extensions/extension/src/main/java/app/morphe/extension/youtube/patches/eternalhistory/**'
      - 'patches/src/main/kotlin/app/eternal/patches/youtube/history/**'
      - '.releaserc'
      - '.github/workflows/validate-maintenance.yml'

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Android release scope safety
        shell: bash
        run: |
          set -euo pipefail
          jq empty .releaserc
          python - <<'PY'
          import json, re
          cfg=json.load(open('.releaserc', encoding='utf-8'))
          analyzer=next(p for p in cfg['plugins'] if isinstance(p, list) and p[0]=='@semantic-release/commit-analyzer')
          rules=analyzer[1]['releaseRules']
          assert any(r.get('scope')=='pc' and r.get('release') is False for r in rules), rules
          assert not any(r.get('type') in {'feat','fix','perf'} and 'scope' not in r for r in rules), rules
          notes=next(p for p in cfg['plugins'] if isinstance(p, list) and p[0]=='@semantic-release/release-notes-generator')
          ignore=notes[1]['presetConfig'].get('ignoreCommits')
          assert ignore == r'^[a-z]+\(pc\):', ignore
          assert re.search(ignore, 'fix(pc): restore single renderer')
          assert not re.search(ignore, 'fix(android): neutralize surface callbacks')
          print('PASS Android semantic-release ignores PC-only changes')
          PY

      - name: PC single-owner presentation and Watch Later safety
        shell: bash
        run: |
          set -euo pipefail
          cd pc-extension/src
          node tests/watch-later-selftest.mjs
          node tests/static-integration-selftest.mjs
          node tests/page-profile-regression-selftest.mjs
          node tests/watch-later-recovery-selftest.mjs
          node tests/watch-later-recovery-static-selftest.mjs
          for f in *.js tests/*.mjs; do node --check "$f" >/dev/null; done

          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const iso=m.content_scripts.find(x=>x.world==='ISOLATED');
          if(!iso) throw new Error('missing ISOLATED world');
          for(const f of ['content.js','pc-stability-guard.js','watch-later-safe.js','watch-later-recovery-content.js','maintenance.js']) {
            if(!iso.js.includes(f)) throw new Error(`missing ${f}`);
          }
          for(const f of ['surface-profiles.js','pc-ui-hotfix.js']) {
            if(iso.js.includes(f)) throw new Error(`stability mode must not load ${f}`);
          }
          if(!iso.css.includes('pc-stability-guard.css')) throw new Error('missing stability CSS');
          console.log('PASS PC manifest single-owner presentation');
          NODE

          grep -F "document.visibilityState !== 'visible'" maintenance.js
          grep -F "watchLaterAutoCleanupEnabled: false" maintenance.js
          ! grep -F 'chrome.alarms' maintenance.js
          ! grep -F 'MutationObserver' pc-stability-guard.js
          grep -F "classList.toggle('eyh-shorts-surface', shorts)" pc-stability-guard.js
          grep -F "watchedDisplayMode: legacyMode" options.js
          ! grep -F "watchedDisplayMode: 'none'" options.js
          echo 'PASS PC stable single renderer + low-frequency maintenance'

      - name: Android navigation stability and transactional cleanup safety
        shell: bash
        run: |
          set -euo pipefail
          base='extensions/extension/src/main/java/app/morphe/extension/youtube/patches/eternalhistory'
          settings="$base/EternalHistorySettings.java"
          sweep="$base/EternalWatchLaterAutoSweep.java"
          payload="$base/EternalWatchLaterPayload.java"
          job="$base/EternalWatchLaterJobService.java"
          addon="$base/EternalHistoryAddOn.java"
          toolbar="$base/EternalHistoryToolbar.java"
          tracker="$base/EternalSurfaceTracker.java"
          surface="$base/EternalSurfaceSettings.java"
          filter="$base/EternalWatchedFilter.java"
          safety="$base/EternalWatchLaterSafety.java"
          coordinator="$base/EternalCleanupCoordinator.java"
          safe_cleaner="$base/EternalWatchLaterSafeCleaner.java"
          tx_store="$base/EternalWatchLaterTransactionStore.java"
          safe_undo="$base/EternalWatchLaterSafeUndo.java"
          support='patches/src/main/kotlin/app/eternal/patches/youtube/history/AddOnSupport.kt'

          # Automatic/legacy deletion remains locked.
          grep -F 'new BooleanSetting("morphe_eternal_history_watch_later_auto_cleanup", FALSE' "$settings"
          grep -F 'DESTRUCTIVE_CLEANUP_LOCKED = true' "$safety"
          grep -F 'EternalWatchLaterSafety.isLocked()' "$job"
          grep -F 'scheduler.cancel(JOB_ID)' "$job"
          grep -F 'EternalHistorySettings.WATCH_LATER_AUTO_CLEANUP.save(false)' "$addon"

          # Manual transaction engine remains strict and rollback-capable.
          grep -F 'EternalCleanupLedgerSync.refresh()' "$coordinator"
          grep -F 'EternalWatchLaterSafeCleaner.previewAndConfirmCleanup(activity)' "$coordinator"
          grep -F 'EternalWatchLaterSafeUndo.undoLastCleanup(activity)' "$coordinator"
          grep -F 'private static ListResult listWatchLaterStrict' "$safe_cleaner"
          grep -F 'pageTokens.size() != 1' "$safe_cleaner"
          grep -F '!consumedTokens.add(next)' "$safe_cleaner"
          grep -F 'entries.size() == before' "$safe_cleaner"
          grep -F 'sameMembership(originalSnapshot, confirmed.entries)' "$safe_cleaner"
          grep -F 'static final int SCHEMA = 2' "$tx_store"
          grep -F 'eternal-watch-later-journal-v2' "$tx_store"
          grep -F 'containsDeleteRisk(current)' "$tx_store"
          grep -F 'EternalWatchLaterTransactionStore.shouldRestore(candidate)' "$safe_undo"

          python - <<'PY'
          from pathlib import Path
          p=Path('extensions/extension/src/main/java/app/morphe/extension/youtube/patches/eternalhistory/EternalWatchLaterSafeCleaner.java').read_text()
          save=p.index('durable = EternalWatchLaterTransactionStore.saveVerified(tx)')
          reread=p.index('ListResult confirmed = listWatchLaterStrict(MAX_PAGES)', save)
          compare=p.index('sameMembership(originalSnapshot, confirmed.entries)', reread)
          removing=p.index('durable.put("state", "removing")', compare)
          assert save < reread < compare < removing
          attempting=p.index('candidate.put("status", "attempting")')
          persist=p.index('durable = EternalWatchLaterTransactionStore.saveVerified(durable)', attempting)
          final_resolve=p.index('Entry finalFresh = resolveEntryStrict(videoId)', persist)
          delete=p.index('removeFreshEntry(finalFresh)', final_resolve)
          result=p.index('durable = persistResult(durable)', delete)
          assert attempting < persist < final_resolve < delete < result
          print('PASS Android transaction ordering assertions')
          PY

          # Stability mode: callbacks preserve ABI but do zero host navigation/view work.
          grep -F 'public static void onBrowseId' "$tracker"
          grep -F 'static void onNavigationChanged' "$tracker"
          grep -F 'return EternalSurfaceSettings.Surface.OTHER;' "$tracker"
          ! grep -F 'publishSurface' "$tracker"
          ! grep -F 'getSelectedNavigationButton' "$tracker"
          ! grep -F 'PlayerType' "$tracker"
          ! grep -F 'NavigationBar.is' "$tracker"

          grep -F 'public static void onToolbarImageView' "$toolbar"
          grep -F 'static void onSurfaceChanged()' "$toolbar"
          grep -F 'static void ensureControlSoon()' "$toolbar"
          ! grep -F 'root.addView' "$toolbar"
          ! grep -F 'findViewById' "$toolbar"
          ! grep -F 'RecyclerView' "$toolbar"
          ! grep -F 'AlertDialog' "$toolbar"

          # Card presentation uses only the common/default profile and pure component-path Shorts exclusion.
          grep -F 'EternalSurfaceSettings.defaultProfile(false)' "$filter"
          grep -F 'looksLikeShortsComponent(path)' "$filter"
          grep -F 'lower.contains("shorts") || lower.contains("reel")' "$filter"
          ! grep -F 'EternalSurfaceTracker.forComponent' "$filter"
          grep -F 'ensureDefaultProfileMigrated()' "$surface"

          # Existing injected call sites/manifest declarations remain compatible while their runtime targets are no-op.
          grep -F 'installEternalBrowseIdHook()' "$support"
          grep -F 'installEternalToolbarHook()' "$support"
          grep -F 'android.permission.BIND_JOB_SERVICE' "$support"
          grep -F 'node.setAttribute("android:exported", "false")' "$support"
          echo 'PASS Android navigation no-op stability + manual transactional safety'
