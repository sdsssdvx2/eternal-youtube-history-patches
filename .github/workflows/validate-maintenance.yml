name: Validate Eternal maintenance

on:
  pull_request:
    paths:
      - 'pc-extension/**'
      - 'extensions/extension/src/main/java/app/morphe/extension/youtube/patches/eternalhistory/**'
      - 'patches/src/main/kotlin/app/eternal/patches/youtube/history/**'
      - '.github/workflows/validate-maintenance.yml'

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: PC maintenance safety
        shell: bash
        run: |
          set -euo pipefail
          cd pc-extension/src
          node tests/watch-later-selftest.mjs
          node tests/static-integration-selftest.mjs
          node tests/page-profile-regression-selftest.mjs
          node --check maintenance.js
          node --check surface-profiles.js
          grep -F "document.visibilityState !== 'visible'" maintenance.js
          grep -F "watchLaterAutoCleanupEnabled: false" maintenance.js
          grep -F "EYH_WL_LIST_REQUEST" maintenance.js
          grep -F "EYH_WL_REMOVE_REQUEST" maintenance.js
          grep -F "ACTIVE_YOUTUBE_SYNC" maintenance.js
          grep -F "maxPages: 100" maintenance.js
          ! grep -F 'chrome.alarms' maintenance.js
          grep -F 'const dim = !hide && profile.dimEnabled' surface-profiles.js
          grep -F 'eyh-surface-watched' surface-profiles.js
          ! grep -F "classList.toggle('eyh-watched'" surface-profiles.js
          grep -F "if (key === 'shorts')" surface-profiles.js
          grep -F 'button?.remove()' surface-profiles.js
          echo 'PASS PC low-frequency maintenance + isolated renderer + Shorts UI safety'
      - name: Android background and transactional cleanup safety
        shell: bash
        run: |
          set -euo pipefail
          base='extensions/extension/src/main/java/app/morphe/extension/youtube/patches/eternalhistory'
          settings="$base/EternalHistorySettings.java"
          payload="$base/EternalWatchLaterPayload.java"
          job="$base/EternalWatchLaterJobService.java"
          addon="$base/EternalHistoryAddOn.java"
          toolbar="$base/EternalHistoryToolbar.java"
          tracker="$base/EternalSurfaceTracker.java"
          surface="$base/EternalSurfaceSettings.java"
          filter="$base/EternalWatchedFilter.java"
          safety="$base/EternalWatchLaterSafety.java"
          coordinator="$base/EternalCleanupCoordinator.java"
          safe_cleaner="$base/EternalWatchLaterSafeCleaner.java"
          safe_undo="$base/EternalWatchLaterSafeUndo.java"
          tx_store="$base/EternalWatchLaterTransactionStore.java"
          support='patches/src/main/kotlin/app/eternal/patches/youtube/history/AddOnSupport.kt'

          grep -F 'new BooleanSetting("morphe_eternal_history_watch_later_auto_cleanup", FALSE' "$settings"
          grep -F 'videos.size() == 1 && setIds.size() == 1' "$payload"

          # Legacy automatic/manual destructive entry points remain permanently safety-locked.
          grep -F 'DESTRUCTIVE_CLEANUP_LOCKED = true' "$safety"
          grep -F 'EternalWatchLaterSafety.isLocked()' "$job"
          grep -F 'EternalHistorySettings.WATCH_LATER_AUTO_CLEANUP.save(false)' "$job"
          grep -F 'scheduler.cancel(JOB_ID)' "$job"
          grep -F 'EternalHistorySettings.WATCH_LATER_AUTO_CLEANUP.save(false)' "$addon"
          grep -F 'if (!EternalWatchLaterSafety.isLocked())' "$addon"
          grep -F 'EternalWatchLaterJobService.refreshSchedule()' "$addon"

          # The manual entry point may reach only the separately audited transaction engine after
          # a successful central-ledger refresh. Undo is routed through the narrowed policy engine.
          grep -F 'EternalCleanupLedgerSync.refresh()' "$coordinator"
          grep -F 'if (!result.success)' "$coordinator"
          grep -F 'EternalWatchLaterSafeCleaner.previewAndConfirmCleanup(activity)' "$coordinator"
          grep -F 'EternalWatchLaterSafeUndo.hasUndoableTransaction()' "$coordinator"
          grep -F 'EternalWatchLaterSafeUndo.undoLastCleanup(activity)' "$coordinator"
          ! grep -E '^[[:space:]]*activity\.runOnUiThread\(\(\) -> EternalWatchLaterCleaner\.previewAndConfirmCleanup' "$coordinator"

          # Crash-safe transaction journal: AtomicFile write + fsync + read-back byte/hash equality.
          grep -F 'AtomicFile' "$tx_store"
          grep -F 'out.getFD().sync()' "$tx_store"
          grep -F 'Arrays.equals(sha256(bytes), sha256(readBack))' "$tx_store"
          grep -F 'Arrays.equals(bytes, readBack)' "$tx_store"
          grep -F 'MAX_SNAPSHOT_ENTRIES = 5000' "$tx_store"
          grep -F '완료되지 않은 이전 안전 정리' "$tx_store"

          # Before delete #1, two independent complete list reads must agree exactly; no partial list
          # may be processed. Pair ambiguity and oversized snapshots fail closed.
          grep -F 'ListResult first = listWatchLater(MAX_PAGES)' "$safe_cleaner"
          grep -F 'if (first.hasMore)' "$safe_cleaner"
          grep -F 'ListResult second = listWatchLater(MAX_PAGES)' "$safe_cleaner"
          grep -F 'if (second.hasMore)' "$safe_cleaner"
          grep -F 'sameMembership(first.entries, second.entries)' "$safe_cleaner"
          grep -F 'parsed.conflict' "$safe_cleaner"
          grep -F 'previousSet != null && !previousSet.equals(setId)' "$safe_cleaner"

          # Durable write-before-delete and per-item write-after-result are source-order locked.
          python - "$safe_cleaner" <<'PY'
          import sys
          text=open(sys.argv[1], encoding='utf-8').read()
          before=text.index('JSONObject durable = EternalWatchLaterTransactionStore.saveVerified(tx)')
          resolve=text.index('Entry fresh = resolveEntryStrict(videoId)', before)
          compare=text.index('!expectedSetVideoId.equals(fresh.setVideoId)', resolve)
          remove=text.index('removeFreshEntry(fresh)', compare)
          persist=text.index('durable = EternalWatchLaterTransactionStore.saveVerified(durable)', remove)
          assert before < resolve < compare < remove < persist
          print('PASS Android transaction source ordering')
          PY

          # Undo never re-adds entries for which cleanup provably sent no delete request.
          grep -F '"missing".equals(status) || "identity_mismatch".equals(status)' "$safe_undo"
          grep -F 'candidate.put("undoStatus", "not_removed")' "$safe_undo"
          grep -F 'PlaylistRoutes.editPlaylistBody(videoId, WATCH_LATER, null)' "$safe_undo"
          python - "$safe_undo" <<'PY'
          import sys
          text=open(sys.argv[1], encoding='utf-8').read()
          policy=text.index('if (!shouldRestore(candidate))')
          add=text.index('addEntry(videoId)', policy)
          body=text.index('PlaylistRoutes.editPlaylistBody(videoId, WATCH_LATER, null)', add)
          assert policy < add < body
          print('PASS Android narrowed undo source ordering')
          PY

          # Real-device tab transitions remain state-only and Shorts carries no Eternal overlay.
          grep -F 'CONTROL_TAG = "eternal-history-floating-control"' "$toolbar"
          grep -F 'root.addView(control' "$toolbar"
          grep -F 'positionControl(root, control)' "$toolbar"
          grep -F 'scheduleControlMount(220L)' "$toolbar"
          grep -F 'Surface.SHORTS' "$toolbar"
          grep -F 'if (surface == EternalSurfaceSettings.Surface.SHORTS) return false;' "$filter"
          grep -F 'NavigationBar.addOnNavigationButtonChangedListener(EternalSurfaceTracker::onNavigationChanged)' "$addon"
          grep -F 'publishSurface(EternalSurfaceSettings.Surface.SHORTS)' "$tracker"
          ! grep -F 'NavigationBar.isSearchBarActive()' "$tracker"
          ! grep -F 'NavigationBar.isBackButtonVisible()' "$tracker"
          ! grep -F 'getSelectedNavigationButton()' "$tracker"
          ! grep -F 'PlayerType.getCurrent()' "$tracker"
          grep -F 'ensureDefaultProfileMigrated()' "$surface"
          grep -F 'hasExplicitProfile' "$surface"

          grep -F 'android.permission.BIND_JOB_SERVICE' "$support"
          grep -F 'node.setAttribute("android:exported", "false")' "$support"
          echo 'PASS Android legacy lock + transactional manual Watch Later cleanup/narrow undo safety'
