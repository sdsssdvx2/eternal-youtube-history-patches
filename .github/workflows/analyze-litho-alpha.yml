name: Analyze Litho alpha hook

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-litho-alpha.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      YT_VERSION: 20.51.39
      YT_TRUSTED_SHA256: 4cb1a507dad189b0eed01440cd6dba4c749c897dae2ff169d659c037bdfbda07
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: krishhari2105/morphe-builds
          path: .analysis/morphe-builds
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Acquire exact trusted YouTube base
        env:
          PYTHONPATH: ${{ github.workspace }}/.analysis/morphe-builds
        run: |
          python -m pip install --disable-pip-version-check requests >/dev/null
          mkdir -p .analysis/input
          python - <<'PY'
          import os
          from pathlib import Path
          from morphe_builder.apkmirror import ApkMirrorResolver
          from morphe_builder.models import AppConfig
          app=AppConfig(key='youtube',name='YouTube',package='com.google.android.youtube',apkmirror_url='https://www.apkmirror.com/apk/google-inc/youtube/',formats=('apk',),prefer=('universal',),target_abi='arm64-v8a')
          r=ApkMirrorResolver(min_request_interval=1.2,max_release_attempts=4,max_variant_attempts=12)
          out=Path('.analysis/input/youtube.apk'); expected=os.environ['YT_TRUSTED_SHA256'].lower(); version=os.environ['YT_VERSION']
          for url,ref in r.iter_candidates(app,version):
              try:
                  got=r.download_candidate(url,ref,out)
                  if got.sha256 == expected:
                      print(f'selected {ref} bytes={got.size} sha256={got.sha256}')
                      break
                  out.unlink(missing_ok=True)
              except Exception: out.unlink(missing_ok=True)
          else: raise SystemExit('validated base not found')
          PY
          echo "$YT_TRUSTED_SHA256  .analysis/input/youtube.apk" | sha256sum -c -
      - name: Decompile exact smali
        shell: bash
        run: |
          set -euo pipefail
          apktool_url="$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | jq -r '.assets[] | select(.name|test("^apktool_[0-9].*\\.jar$")) | .browser_download_url' | head -1)"
          test -n "$apktool_url"
          curl -fL --retry 3 "$apktool_url" -o .analysis/apktool.jar
          # Apktool 3 decodes sources by default. -r skips resources only; the old -s=false syntax
          # is invalid in Apktool 3 and prevented the diagnostic from ever reaching smali output.
          java -jar .analysis/apktool.jar d -f -r .analysis/input/youtube.apk -o .analysis/apktool >/tmp/apktool-alpha.log 2>&1 || {
            cat /tmp/apktool-alpha.log
            exit 1
          }
          find .analysis/apktool -type f -name '*.smali' -print -quit | grep -q .
      - name: Inspect all View.setAlpha Litho candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee .analysis/litho-candidates.txt
          from pathlib import Path
          import re

          root = Path('.analysis/apktool')
          alpha = 'Landroid/view/View;->setAlpha(F)V'
          desc = 'Landroid/view/View;->setContentDescription(Ljava/lang/CharSequence;)V'
          hits=[]
          for p in root.rglob('*.smali'):
              try: lines=p.read_text(encoding='utf-8', errors='replace').splitlines()
              except Exception: continue
              for i,line in enumerate(lines):
                  if alpha not in line: continue
                  s=i
                  while s>=0 and not lines[s].lstrip().startswith('.method '): s-=1
                  e=i
                  while e<len(lines) and not lines[e].lstrip().startswith('.end method'): e+=1
                  if s<0 or e>=len(lines): continue
                  method=lines[s:e+1]
                  score=0
                  if any(desc in x for x in method): score+=100
                  if ' static ' in (' '+lines[s]+' '): score+=10
                  if lines[s].rstrip().endswith(')V'): score+=5
                  iget_float=[]
                  for j in range(max(s,i-8), i):
                      if re.search(r'\biget\s+[vp]\d+,\s*[vp]\d+,\s*L[^;]+;->[^:]+:F', lines[j]):
                          iget_float.append((j,lines[j]))
                          score+=20
                  hits.append((score,p,s,e,i,iget_float,method))

          hits.sort(key=lambda x:(-x[0],str(x[1]),x[4]))
          print(f'TOTAL_SET_ALPHA_HITS={len(hits)}')
          for n,(score,p,s,e,i,igets,method) in enumerate(hits[:80],1):
              print(f'===== CANDIDATE {n} score={score} file={p} methodLine={s+1} hitLine={i+1} =====')
              print(method[0].strip())
              print('HAS_SET_CONTENT_DESCRIPTION=' + str(any(desc in x for x in method)))
              print('NEARBY_IGET_FLOAT=' + str(len(igets)))
              src=p.read_text(encoding='utf-8', errors='replace').splitlines()
              for j in range(max(s,i-16), min(e+1,i+17)):
                  print(f'{j+1:6}: {src[j]}')
              for j in range(s,e+1):
                  if desc in src[j] and abs(j-i)>16:
                      print(f'DESC {j+1:6}: {src[j]}')
          if not hits:
              raise SystemExit('no View.setAlpha(F)V calls found')
          PY
          test -s .analysis/litho-candidates.txt
      - name: Upload compact Litho candidate report
        uses: actions/upload-artifact@v6
        with:
          name: litho-alpha-candidates-${{ env.YT_VERSION }}
          path: .analysis/litho-candidates.txt
          if-no-files-found: error
          retention-days: 3
      - name: Cleanup
        if: always()
        run: rm -rf .analysis/input .analysis/apktool .analysis/apktool.jar
