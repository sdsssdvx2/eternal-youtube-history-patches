name: Analyze Litho alpha hook

# Debug rerun: 2026-10-11 watched-card dim hook ordering
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-litho-alpha.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: krishhari2105/morphe-builds
          path: .analysis/morphe-builds
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Acquire validated YouTube base
        env:
          PYTHONPATH: ${{ github.workspace }}/.analysis/morphe-builds
        run: |
          python -m pip install --disable-pip-version-check requests >/dev/null
          mkdir -p .analysis/input
          python - <<'PY'
          from pathlib import Path
          from morphe_builder.apkmirror import ApkMirrorResolver
          from morphe_builder.models import AppConfig
          app=AppConfig(key='youtube',name='YouTube',package='com.google.android.youtube',apkmirror_url='https://www.apkmirror.com/apk/google-inc/youtube/',formats=('apk',),prefer=('universal',),target_abi='arm64-v8a')
          r=ApkMirrorResolver(min_request_interval=1.2,max_release_attempts=3,max_variant_attempts=10)
          out=Path('.analysis/input/youtube.apk'); expected='724d2bf15d31dac98db00d82914db3876edf66e62fe2845001f204209ecf4c00'
          for url,ref in r.iter_candidates(app,'21.16.256'):
              try:
                  got=r.download_candidate(url,ref,out)
                  if got.sha256 == expected: break
                  out.unlink(missing_ok=True)
              except Exception: out.unlink(missing_ok=True)
          else: raise SystemExit('validated base not found')
          PY
      - name: Decompile Java
        shell: bash
        run: |
          set -euo pipefail
          url="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest | jq -r '.assets[] | select(.name|startswith("jadx-") and endswith(".zip") and (contains("gui")|not)) | .browser_download_url' | head -1)"
          curl -fL --retry 3 "$url" -o .analysis/jadx.zip
          unzip -q .analysis/jadx.zip -d .analysis/jadx
          mkdir -p .analysis/decompiled
          .analysis/jadx/bin/jadx --no-res --show-bad-code --threads-count 4 -d .analysis/decompiled .analysis/input/youtube.apk >/tmp/jadx-alpha.log 2>&1 || true
          test -d .analysis/decompiled/sources/defpackage
      - name: Inspect exact Litho alpha Java targets
        shell: bash
        run: |
          set -euo pipefail
          D=.analysis/decompiled/sources/defpackage
          for cls in ggo gij gtx guf gho gee gfg ghz gjz tqu uzc gec tri; do
            f="$D/$cls.java"
            [ -f "$f" ] || continue
            echo "===== $cls signatures/fields ====="
            grep -n -E '^(public|final|class|interface|    public|    final|    private|    protected|    static)|setAlpha|alpha|floatValue|Float\.valueOf|ComponentHost' "$f" | head -520 || true
          done
          echo '===== setAlpha hits inside known Litho classes ====='
          grep -n -E 'setAlpha\(' "$D"/{ggo,gij,gtx,guf,gho,gee,gfg,ghz,gjz,tqu,uzc,gec,tri}.java 2>/dev/null || true
          echo '===== exact ghz methods around setAlpha ====='
          grep -n -B85 -A85 'setAlpha(' "$D/ghz.java" | head -1800 || true
          echo '===== exact gij alpha setter ====='
          grep -n -B25 -A45 'public final void g(float' "$D/gij.java" || true
      - name: Decompile exact smali
        shell: bash
        run: |
          set -euo pipefail
          apktool_url="$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | jq -r '.assets[] | select(.name|test("^apktool_[0-9].*\\.jar$")) | .browser_download_url' | head -1)"
          test -n "$apktool_url"
          curl -fL --retry 3 "$apktool_url" -o .analysis/apktool.jar
          java -jar .analysis/apktool.jar d -f -r -s=false .analysis/input/youtube.apk -o .analysis/apktool >/tmp/apktool-alpha.log 2>&1 || {
            cat /tmp/apktool-alpha.log
            exit 1
          }
      - name: Inspect exact Litho alpha smali
        shell: bash
        run: |
          set -euo pipefail
          GHZ="$(find .analysis/apktool -type f -path '*/defpackage/ghz.smali' | head -1)"
          GIJ="$(find .analysis/apktool -type f -path '*/defpackage/gij.smali' | head -1)"
          test -n "$GHZ" && test -n "$GIJ"
          echo "===== GHZ FILE: $GHZ ====="
          grep -n -B55 -A55 'Landroid/view/View;->setAlpha(F)V' "$GHZ" | head -900 || true
          echo "===== GHZ METHOD HEADERS CONTAINING setAlpha ====="
          python - "$GHZ" <<'PY'
          import sys
          p=sys.argv[1]
          lines=open(p,encoding='utf-8').read().splitlines()
          for i,line in enumerate(lines):
              if 'Landroid/view/View;->setAlpha(F)V' not in line: continue
              start=i
              while start>=0 and not lines[start].lstrip().startswith('.method '): start-=1
              end=i
              while end<len(lines) and not lines[end].lstrip().startswith('.end method'): end+=1
              print(f'--- hit line {i+1} / method line {start+1}: {lines[start].strip()}')
              for j in range(max(start,i-35), min(end+1,i+36)):
                  print(f'{j+1:6}: {lines[j]}')
          PY
          echo "===== GIJ alpha float setter candidates ====="
          grep -n -B18 -A38 -E '^\.method .*\(F\)V|->m:F|0x100000' "$GIJ" | head -1200 || true
      - name: Cleanup
        if: always()
        run: rm -rf .analysis/input .analysis/decompiled .analysis/jadx .analysis/jadx.zip .analysis/apktool .analysis/apktool.jar
