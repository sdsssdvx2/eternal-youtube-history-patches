name: Implement watched-card dim mode

on:
  push:
    paths:
      - '.github/workflows/implement-watched-dim.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply implementation
        run: python3 tools/run_dim_impl.py
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extensions patches
          git commit -m 'feat: add watched-card dim mode'
          git push
