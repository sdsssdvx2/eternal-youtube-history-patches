name: Bootstrap PC extension source

on:
  push:
    branches: [ feat-pc-extension-source-073 ]
    paths:
      - 'pc-extension/.bootstrap/**'
      - '.github/workflows/bootstrap-pc-source.yml'

permissions:
  contents: write

concurrency:
  group: bootstrap-pc-extension-source
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reconstruct, verify and import canonical v0.7.3 source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f pc-extension/.bootstrap/chunk-07.b64 ]; then
            echo 'Bootstrap chunks already removed; nothing to do.'
            exit 0
          fi

          cat pc-extension/.bootstrap/chunk-*.b64 | base64 --decode > /tmp/pc073.zip
          echo 'afa2c6a4502c0a622da02f70232859081e8b89c7927820318f8f2957aa62d50e  /tmp/pc073.zip' | sha256sum -c -
          unzip -t /tmp/pc073.zip

          rm -rf /tmp/pc073 pc-extension/src
          mkdir -p /tmp/pc073 pc-extension/src
          unzip -q /tmp/pc073.zip -d /tmp/pc073
          cp -a /tmp/pc073/eternal-youtube-history-v0.7.3/extension/. pc-extension/src/
          test "$(jq -r '.version' pc-extension/src/manifest.json)" = '0.7.3'

          # The temporary transfer pieces must never remain in the canonical branch.
          rm -rf pc-extension/.bootstrap

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A pc-extension
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'chore(pc): import canonical v0.7.3 extension source'
          git push origin HEAD:feat-pc-extension-source-073
