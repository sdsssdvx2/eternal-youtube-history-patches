name: Monitor Android update candidates

on:
  workflow_dispatch:
  schedule:
    - cron: '55 */6 * * *'
  push:
    paths:
      - '.github/workflows/monitor-android-updates.yml'

concurrency:
  group: monitor-android-update-candidates
  cancel-in-progress: true

# This public repository can observe public Morphe/Eternal candidates, but it cannot prove that the
# private same-signer builder actually produced the corresponding APK. Never mutate the deployed
# status from a timing assumption. android-update-status.json is release evidence, not a wishlist.
permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve public non-downgrade candidates without publishing them
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .update-monitor

          curl -fsSL https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest > .update-monitor/morphe.json
          MORPHE_TAG="$(jq -r '.tag_name' .update-monitor/morphe.json)"
          test -n "$MORPHE_TAG" && test "$MORPHE_TAG" != null

          curl -fsSL "https://raw.githubusercontent.com/MorpheApp/morphe-patches/${MORPHE_TAG}/patches/src/main/kotlin/app/morphe/patches/youtube/shared/Constants.kt" > .update-monitor/youtube.kt
          curl -fsSL "https://raw.githubusercontent.com/MorpheApp/morphe-patches/${MORPHE_TAG}/patches/src/main/kotlin/app/morphe/patches/music/shared/Constants.kt" > .update-monitor/music.kt
          curl -fsSL https://api.github.com/repos/MorpheApp/MicroG-RE/releases/latest > .update-monitor/microg.json
          curl -fsSL https://api.github.com/repos/sdsssdvx2/eternal-youtube-history-patches/releases/latest > .update-monitor/eternal.json
          ETERNAL_TAG="$(jq -r '.tag_name' .update-monitor/eternal.json)"
          test -n "$ETERNAL_TAG" && test "$ETERNAL_TAG" != null
          curl -fsSL "https://raw.githubusercontent.com/sdsssdvx2/eternal-youtube-history-patches/${ETERNAL_TAG}/patches/src/main/kotlin/app/eternal/patches/youtube/history/EternalHistoryPatch.kt" > .update-monitor/eternal-youtube.kt

          python3 - <<'PY'
          import json, re
          from pathlib import Path

          def stable_targets(path):
              text = Path(path).read_text()
              result = []
              for m in re.finditer(r'AppTarget\((.*?)\)', text, re.S):
                  block = m.group(1)
                  vm = re.search(r'version\s*=\s*"([^"]+)"', block)
                  if not vm or re.search(r'isExperimental\s*=\s*true', block):
                      continue
                  mm = re.search(r'minSdk\s*=\s*(\d+)', block)
                  result.append({
                      'version': vm.group(1),
                      'min_sdk': int(mm.group(1)) if mm else None,
                  })
              if not result:
                  raise RuntimeError(f'No stable target found in {path}')
              return result

          def version_key(version):
              return tuple(int(part) for part in version.split('.'))

          def eternal_versions(path):
              text = Path(path).read_text()
              versions = re.findall(r'AppTarget\(\s*version\s*=\s*"([^"]+)"', text, re.S)
              if not versions:
                  raise RuntimeError('No Eternal YouTube compatibility targets found')
              return set(versions)

          deployed = json.loads(Path('android-update-status.json').read_text())
          morphe = json.loads(Path('.update-monitor/morphe.json').read_text())
          microg = json.loads(Path('.update-monitor/microg.json').read_text())
          eternal = json.loads(Path('.update-monitor/eternal.json').read_text())

          current_yt = deployed['youtube']['version']
          current_music = deployed['youtube_music']['version']
          yt_supported = eternal_versions('.update-monitor/eternal-youtube.kt')
          youtube = next(
              (target for target in stable_targets('.update-monitor/youtube.kt')
               if target['version'] in yt_supported
               and version_key(target['version']) >= version_key(current_yt)),
              None,
          )
          music = next(
              (target for target in stable_targets('.update-monitor/music.kt')
               if version_key(target['version']) >= version_key(current_music)),
              None,
          )

          mg_tag = microg['tag_name']
          arm64 = next(
              (a for a in microg.get('assets', [])
               if a.get('name') == f'microg-{mg_tag}-icon-arm64-v8a.apk'),
              None,
          )

          candidate = {
              'schema': 1,
              'evidence': 'public-candidate-only',
              'publishable': False,
              'reason': 'A matching private same-signer APK release has not been proven by this public workflow.',
              'deployed': {
                  'morphe_patches': deployed.get('morphe_patches'),
                  'eternal_patches': deployed.get('eternal_patches'),
                  'youtube': deployed.get('youtube'),
                  'youtube_music': deployed.get('youtube_music'),
              },
              'candidate': {
                  'morphe_patches': morphe['tag_name'],
                  'eternal_patches': eternal['tag_name'],
                  'youtube': youtube,
                  'youtube_music': music,
                  'microg_re': {
                      'version': mg_tag,
                      'arm64_asset': arm64['browser_download_url'] if arm64 else None,
                      'arm64_sha256': (arm64.get('digest') or '').removeprefix('sha256:') if arm64 else None,
                  },
              },
          }
          print(json.dumps(candidate, ensure_ascii=False, indent=2))
          Path('.update-monitor/candidate.json').write_text(
              json.dumps(candidate, ensure_ascii=False, indent=2) + '\n'
          )
          PY

      - name: Prove deployed status was not mutated
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- android-update-status.json
          echo 'PASS public monitor is read-only; deployed status requires signed-release evidence.'
