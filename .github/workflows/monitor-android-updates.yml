name: Monitor Android update targets

on:
  workflow_dispatch:
  schedule:
    - cron: '55 */6 * * *'
  push:
    paths:
      - '.github/workflows/monitor-android-updates.yml'
      - '.github/workflows/validate-android-targets.yml'

concurrency:
  group: monitor-android-update-targets
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve candidate Morphe, Eternal, YouTube, Music and MicroG-RE targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .update-monitor

          curl -fsSL https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest > .update-monitor/morphe.json
          MORPHE_TAG="$(jq -r '.tag_name' .update-monitor/morphe.json)"
          test -n "$MORPHE_TAG" && test "$MORPHE_TAG" != null

          curl -fsSL "https://raw.githubusercontent.com/MorpheApp/morphe-patches/${MORPHE_TAG}/patches/src/main/kotlin/app/morphe/patches/youtube/shared/Constants.kt" > .update-monitor/youtube.kt
          curl -fsSL "https://raw.githubusercontent.com/MorpheApp/morphe-patches/${MORPHE_TAG}/patches/src/main/kotlin/app/morphe/patches/music/shared/Constants.kt" > .update-monitor/music.kt
          curl -fsSL https://api.github.com/repos/MorpheApp/MicroG-RE/releases/latest > .update-monitor/microg.json
          curl -fsSL https://api.github.com/repos/sdsssdvx2/eternal-youtube-history-patches/releases/latest > .update-monitor/eternal.json
          ETERNAL_TAG="$(jq -r '.tag_name' .update-monitor/eternal.json)"
          test -n "$ETERNAL_TAG" && test "$ETERNAL_TAG" != null

          # Let the private signed-builder get its normal :41 schedule opportunity before validating
          # and promoting a public recommendation. A promotion is still gated by server patch success.
          now_epoch="$(date -u +%s)"
          for release_json in .update-monitor/morphe.json .update-monitor/eternal.json; do
            published="$(jq -r '.published_at // .created_at // empty' "$release_json")"
            test -n "$published"
            published_epoch="$(date -u -d "$published" +%s)"
            age="$((now_epoch - published_epoch))"
            if [ "$age" -lt 21600 ]; then
              echo "Newest public target is only ${age}s old; keep the previous validated status until the next monitor window."
              exit 0
            fi
          done

          curl -fsSL "https://raw.githubusercontent.com/sdsssdvx2/eternal-youtube-history-patches/${ETERNAL_TAG}/patches/src/main/kotlin/app/eternal/patches/youtube/history/EternalHistoryPatch.kt" > .update-monitor/eternal-youtube.kt

          python3 - <<'PY'
          import json, re
          from pathlib import Path

          # Production base pins are promoted only after repeated standalone acquisition and a
          # successful feature-branch patch smoke. 21.30.216 was independently resolved twice to
          # the same 198,948,665-byte standalone APK before this digest was added.
          TRUSTED_YOUTUBE = {
              '20.51.39': '4cb1a507dad189b0eed01440cd6dba4c749c897dae2ff169d659c037bdfbda07',
              '21.16.256': '724d2bf15d31dac98db00d82914db3876edf66e62fe2845001f204209ecf4c00',
              '21.20.405': '4b3ca9de0eb6857d43fa8766a724a2eba6405dfdbcdfb20eef6cb8950e805e2c',
              '21.30.216': '3775a15129dcc4e5b80fc17b7e0841b7fdd1ca89a6e72baa798806f666c74d02',
          }
          TRUSTED_MUSIC = {
              '9.20.53': '5c4add71134d46818c855959e1c7029518c68be9e56ef172119626539d32c852',
              '9.30.53': '1fe8d535ae445265c7250ed76a24c340e1dc89f2ab5d265f755800fe23ad334e',
          }

          def stable_targets(path):
              text = Path(path).read_text()
              result = []
              for m in re.finditer(r'AppTarget\((.*?)\)', text, re.S):
                  block = m.group(1)
                  vm = re.search(r'version\s*=\s*"([^"]+)"', block)
                  if not vm or re.search(r'isExperimental\s*=\s*true', block):
                      continue
                  mm = re.search(r'minSdk\s*=\s*(\d+)', block)
                  result.append({
                      'version': vm.group(1),
                      'min_sdk': int(mm.group(1)) if mm else None,
                  })
              if not result:
                  raise RuntimeError(f'No stable target found in {path}')
              return result

          def eternal_versions(path):
              text = Path(path).read_text()
              versions = re.findall(r'AppTarget\(\s*version\s*=\s*"([^"]+)"', text, re.S)
              if not versions:
                  raise RuntimeError('No Eternal YouTube compatibility targets found')
              return set(versions)

          morphe = json.loads(Path('.update-monitor/morphe.json').read_text())
          microg = json.loads(Path('.update-monitor/microg.json').read_text())
          eternal = json.loads(Path('.update-monitor/eternal.json').read_text())

          supported = eternal_versions('.update-monitor/eternal-youtube.kt')
          youtube = next((t for t in stable_targets('.update-monitor/youtube.kt') if t['version'] in supported), None)
          if youtube is None:
              raise RuntimeError(f"No stable Morphe YouTube target is compatible with Eternal {eternal['tag_name']}")
          music = stable_targets('.update-monitor/music.kt')[0]

          youtube_sha = TRUSTED_YOUTUBE.get(youtube['version'])
          music_sha = TRUSTED_MUSIC.get(music['version'])
          if not youtube_sha:
              raise RuntimeError(
                  f"Candidate YouTube {youtube['version']} has no reviewed standalone SHA-256 pin; refusing automatic promotion"
              )
          if not music_sha:
              raise RuntimeError(
                  f"Candidate YouTube Music {music['version']} has no reviewed standalone SHA-256 pin; refusing automatic promotion"
              )

          mg_tag = microg['tag_name']
          arm64 = next(
              (a for a in microg.get('assets', []) if a.get('name') == f'microg-{mg_tag}-icon-arm64-v8a.apk'),
              None,
          )
          if not arm64:
              raise RuntimeError(f'No arm64 MicroG-RE asset for {mg_tag}')
          mg_sha = (arm64.get('digest') or '').removeprefix('sha256:')
          if not re.fullmatch(r'[0-9a-fA-F]{64}', mg_sha):
              raise RuntimeError('MicroG-RE arm64 release asset has no trusted SHA-256 digest')

          candidate = {
              'schema': 2,
              'morphe_patches': morphe['tag_name'],
              'eternal_patches': eternal['tag_name'],
              'youtube': {**youtube, 'sha256': youtube_sha},
              'youtube_music': {**music, 'sha256': music_sha},
              'microg_re': {
                  'version': mg_tag,
                  'arm64_asset': arm64['browser_download_url'],
                  'arm64_sha256': mg_sha.lower(),
              },
          }
          Path('.update-monitor/candidate.json').write_text(json.dumps(candidate, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(candidate, indent=2))
          PY

      - name: Skip when candidate already equals validated status
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json
          from pathlib import Path
          current = json.loads(Path('android-update-status.json').read_text())
          candidate = json.loads(Path('.update-monitor/candidate.json').read_text())
          # SHA pins are validator inputs, not part of the public status schema.
          candidate['youtube'].pop('sha256', None)
          candidate['youtube_music'].pop('sha256', None)
          if current == candidate:
              Path('/tmp/same').write_text('1')
          PY
          if [ -f /tmp/same ]; then
            echo 'changed=false' > "$GITHUB_OUTPUT"
            echo 'Candidate already matches the last validated public status.'
          fi

      # Candidate metadata is never written to android-update-status.json here. The validator owns
      # promotion and commits only after both production APKs patch successfully with exact SHA pins.
      - name: Dispatch candidate validation and promotion
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          c=.update-monitor/candidate.json
          gh workflow run validate-android-targets.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f morphe_tag="$(jq -r '.morphe_patches' "$c")" \
            -f eternal_tag="$(jq -r '.eternal_patches' "$c")" \
            -f youtube_version="$(jq -r '.youtube.version' "$c")" \
            -f youtube_min_sdk="$(jq -r '.youtube.min_sdk' "$c")" \
            -f youtube_sha256="$(jq -r '.youtube.sha256' "$c")" \
            -f music_version="$(jq -r '.youtube_music.version' "$c")" \
            -f music_min_sdk="$(jq -r '.youtube_music.min_sdk' "$c")" \
            -f music_sha256="$(jq -r '.youtube_music.sha256' "$c")" \
            -f microg_version="$(jq -r '.microg_re.version' "$c")" \
            -f microg_asset="$(jq -r '.microg_re.arm64_asset' "$c")" \
            -f microg_sha256="$(jq -r '.microg_re.arm64_sha256' "$c")" \
            -f publish=true
          echo 'Dispatched candidate validation; public status remains unchanged unless both patch jobs succeed.'
